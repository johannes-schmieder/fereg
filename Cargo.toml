[workspace]
exclude = ["vendor/rayon-core"]
members = [
    "crates/fedemean",
    "crates/fereg-core",
    "crates/fereg-plugin",
    "crates/fereg-testkit",
    "crates/fereg-oracle",
]
resolver = "2"

[workspace.package]
version = "0.5.3"
edition = "2021"
rust-version = "1.85"
authors = ["fereg contributors"]
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[profile.profiling]
inherits = "release"
lto = "thin"
strip = false
debug = true

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
debug-assertions = true

[patch.crates-io]
rayon-core = { path = "vendor/rayon-core" }

# Local override of the pinned CMG revision (crates/fedemean and
# crates/fereg-core pin e5613e81fb3b03c78de98658b372646fa802aabb) by the
# isolated clone beside this worktree, branch fedemean-parallel: the
# branch-free canonical edge sort and team applications of every planned
# level, both bitwise neutral. Remove it, and bump the pins, once those
# commits are published; release packaging refuses a path-overridden CMG.
[patch."https://github.com/johannes-schmieder/CMG"]
cmg = { path = "../CMG-fedemean" }
