[workspace]
exclude = ["vendor/rayon-core"]
members = [
    "legacy/fereg-core",
    "crates/fereg-plugin",
    "legacy/fereg-testkit",
    "crates/fereg-oracle",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
authors = ["fereg contributors"]
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[profile.profiling]
inherits = "release"
lto = "thin"
strip = false
debug = true

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
debug-assertions = true

[patch.crates-io]
rayon-core = { path = "vendor/rayon-core" }
