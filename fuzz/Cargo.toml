[package]
name = "fereg-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
fereg-core = { path = "../crates/fereg-core" }
fereg-plugin = { path = "../crates/fereg-plugin", default-features = false }
libfuzzer-sys = "0.4"

[[bin]]
name = "raw_abi_args"
path = "fuzz_targets/raw_abi_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key_value_protocol"
path = "fuzz_targets/key_value_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_spec_tables"
path = "fuzz_targets/model_spec_tables.rs"
test = false
doc = false
bench = false

[[bin]]
name = "factorization"
path = "fuzz_targets/factorization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "interaction_tuples"
path = "fuzz_targets/interaction_tuples.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
