schema_version = 2
pinned_at_utc = "2026-08-21"
policy = "Exact immutable commits and local SHA-256 hashes; no floating branch is a parity oracle."

[ols_v1_capture]
manifest = "benchmarks/manifests/ols_v1.json"
reference_root_layout = "<absolute-root>/reghdfe, <absolute-root>/ftools, and <absolute-root>/require must be clean direct-child git checkouts"
network_policy = "offline-only; the runner never installs or fetches reference commands"
eligibility = "exact source pins are resolved; capture requires all three matching clean local checkouts, and candidate performance may pass only after exact scientific parity"
raw_log_policy = "Stata logs and machine capture streams are temporary licensed artifacts and must not be committed"


[governing_spec]
file = "AGENTS.md"
sha256 = "5c59d9d0b453c9096884199f397ba5ca22086cf6d283020137692d7aa7dc57d8"
source_filename = "fereg 1.0 Rust-First Implementation Plan for Codex.md"

