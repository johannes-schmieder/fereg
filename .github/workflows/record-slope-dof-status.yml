name: Record absorbed-slope scientific decision in STATUS

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/record-slope-dof-status.yml"

permissions:
  contents: write

concurrency:
  group: stfixest-status-${{ github.repository }}
  cancel-in-progress: false

jobs:
  record:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Patch the sole mutable status record idempotently
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path('STATUS.md')
          text = path.read_text(encoding='utf-8')
          old_active = (
              '**Active milestone:** implement the remaining frozen OLS blockers in manifest order, '
              'next `intercept_and_slope`'
          )
          new_active = (
              '**Active milestone:** scientific decision required for the frozen absorbed-slope '
              'negative-DoF cases; see `SCIENTIFIC_QUESTION.md`'
          )
          if old_active in text:
              text = text.replace(old_active, new_active, 1)
          elif new_active not in text:
              raise SystemExit('STATUS active-milestone anchor is not unique')

          disabled = (
              '- `stfeols`, `stfepois`, public `estimate-ols`, and public `estimate-ppml`\n'
              '  remain deliberately disabled.\n'
          )
          decision = (
              '- The next two frozen absorbed-slope cases expose a registered scientific-policy\n'
              '  conflict. The pinned `intercept_and_slope` receipt has `N=24`, `df_a=26`,\n'
              '  `df_r=-2`, and a negative iid intercept variance; `slope_only_multiple` has\n'
              '  `df_r=-8`. The certified StFixest OLS core requires positive residual DoF and\n'
              '  fails closed before publishing covariance or fit statistics. No estimator\n'
              '  behavior, frozen manifest, or executable projection has been changed.\n'
              '  `SCIENTIFIC_QUESTION.md` records the required A/B/C decision.\n'
          )
          if decision not in text:
              if text.count(disabled) != 1:
                  raise SystemExit('STATUS disabled-surface anchor is not unique')
              text = text.replace(disabled, decision + disabled, 1)

          old_checkpoint = (
              'The next formally required gate is the frozen `intercept_and_slope` case.\n'
              'Its absorbed intercept-plus-slope implementation must preserve sample, weight,\n'
              'solver-certificate, absorbed/residual DoF, VCE, omission, allocation, and\n'
              'transaction contracts and must have an independent explicit-dummy oracle\n'
              'before it may move from blocker to executable. Public dispatch stays disabled.\n'
          )
          new_checkpoint = (
              'The next formally required gate remains the frozen `intercept_and_slope` case,\n'
              'but its current pinned test design is over-absorbed: `N=24`, `df_a=26`, and\n'
              '`df_r=-2`. Pinned reghdfe succeeds and posts negative iid variance, while the\n'
              'registered StFixest core requires `df_r>0` and fails closed. Development may\n'
              'continue on ordinary slope plumbing only after the A/B/C policy in\n'
              '`SCIENTIFIC_QUESTION.md` is chosen; no covariance, DoF, frozen-manifest, or\n'
              'projection behavior may be changed implicitly. Public dispatch stays disabled.\n'
          )
          if old_checkpoint in text:
              text = text.replace(old_checkpoint, new_checkpoint, 1)
          elif new_checkpoint not in text:
              raise SystemExit('STATUS active-checkpoint anchor is not unique')

          old_resume = (
              'Implement and qualify the frozen `intercept_and_slope` blocker. Do not advance\n'
              'to slope-only terms, strings, time-series materialization, iweights, saved\n'
              'outputs, or public postestimation until that exact case is independently and\n'
              'receipt-bound green.\n'
          )
          new_resume = (
              'Resolve `SCIENTIFIC_QUESTION.md` before changing residual-DoF, iid covariance,\n'
              'fit-statistic, frozen-manifest, or public compatibility behavior. The recommended\n'
              'path is option A: preserve positive residual DoF and recapture the slope command\n'
              'on a dedicated positive-DoF synthetic fixture. Do not advance to later blockers\n'
              'or claim the slope case complete before the decision is explicit.\n'
          )
          if old_resume in text:
              text = text.replace(old_resume, new_resume, 1)
          elif new_resume not in text:
              raise SystemExit('STATUS resume-point anchor is not unique')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit status and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/record-slope-dof-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md .github/workflows/record-slope-dof-status.yml
          git commit -m "docs(ols): mark absorbed-slope scientific decision [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((2 * attempt))
          done
          exit 1
