name: Expand hidden OLS projection to accepted interaction case

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/expand-hidden-ols-projection.yml"

permissions:
  contents: write

concurrency:
  group: stfixest-mac-${{ github.repository }}
  cancel-in-progress: false

jobs:
  expand:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the narrow 31/9 projection change idempotently
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          /usr/bin/python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          projection_path = Path('benchmarks/manifests/ols_hidden_numeric_v1.json')
          script_path = Path('scripts/ols_hidden_numeric.py')
          test_path = Path('tests/python/test_ols_hidden_numeric.py')

          projection = json.loads(projection_path.read_text(encoding='utf-8'))
          executable = projection['executable_case_ids']
          blockers = projection['blockers']
          target = 'multi_fe_interactions'
          expected_remaining = [
              'intercept_and_slope',
              'slope_only_multiple',
              'string_fe',
              'time_series_lag',
              'time_series_lead_difference_gaps',
              'iweight_probe',
              'dof_continuous',
              'saved_outputs',
              'postestimation_test_summarize',
          ]

          if target not in executable:
              if len(executable) != 30 or len(blockers) != 10:
                  raise SystemExit('unexpected pre-expansion projection inventory')
              if blockers[0] != {
                  'case_id': target,
                  'reason': 'absorbed_categorical_interaction',
              }:
                  raise SystemExit('interaction blocker is not the reviewed first blocker')
              anchor = executable.index('one_fe_robust') + 1
              executable.insert(anchor, target)
              blockers.pop(0)
              projection_path.write_text(
                  json.dumps(projection, indent=2, ensure_ascii=True) + '\n',
                  encoding='utf-8',
              )

              script = script_path.read_text(encoding='utf-8')
              executable_anchor = (
                  '    "one_fe_robust",\n'
                  '    "disconnected_no_regressors",\n'
              )
              executable_replacement = (
                  '    "one_fe_robust",\n'
                  '    "multi_fe_interactions",\n'
                  '    "disconnected_no_regressors",\n'
              )
              blocker_anchor = (
                  '    ("multi_fe_interactions", '
                  '"absorbed_categorical_interaction"),\n'
              )
              if script.count(executable_anchor) != 1 or script.count(blocker_anchor) != 1:
                  raise SystemExit('hidden projection Python anchors are not unique')
              script = script.replace(executable_anchor, executable_replacement, 1)
              script = script.replace(blocker_anchor, '', 1)
              script_path.write_text(script, encoding='utf-8')

              tests = test_path.read_text(encoding='utf-8')
              count_anchor = (
                  '        self.assertEqual(len(manifest["semantic_cases"]), 30)\n'
              )
              count_replacement = (
                  '        self.assertEqual(len(manifest["semantic_cases"]), 31)\n'
                  '        self.assertEqual(\n'
                  '            [case["id"] for case in manifest["semantic_cases"][:3]],\n'
                  '            ["unweighted_no_fe", "one_fe_robust", '
                  '"multi_fe_interactions"],\n'
                  '        )\n'
              )
              if tests.count(count_anchor) != 1:
                  raise SystemExit('hidden projection test count anchor is not unique')
              tests = tests.replace(count_anchor, count_replacement, 1)
              test_path.write_text(tests, encoding='utf-8')

          projection = json.loads(projection_path.read_text(encoding='utf-8'))
          executable = projection['executable_case_ids']
          blockers = projection['blockers']
          if len(executable) != 31 or len(blockers) != 9:
              raise SystemExit('expanded projection is not exactly 31 executable / 9 blocked')
          if executable[:3] != [
              'unweighted_no_fe',
              'one_fe_robust',
              target,
          ]:
              raise SystemExit('expanded projection does not preserve parent case order')
          if [item['case_id'] for item in blockers] != expected_remaining:
              raise SystemExit('remaining blocker inventory changed')
          if any(item['case_id'] == target for item in blockers):
              raise SystemExit('accepted interaction case remains blocked')
          PY

      - name: Validate projection contracts before publication
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ols_hidden_numeric.py validate-projection
          /usr/bin/python3 -m unittest tests/python/test_ols_hidden_numeric.py
          /usr/bin/python3 scripts/check_repository.py

      - name: Commit one coherent source checkpoint and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/expand-hidden-ols-projection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test(ols): expand hidden projection to FE interactions"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((2 * attempt))
          done
          exit 1
