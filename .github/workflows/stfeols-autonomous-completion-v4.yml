name: Run corrected bootstrapped stfeols completion

on:
  workflow_dispatch:
    inputs:
      phases:
        description: Maximum one-gate coding phases in this run
        required: true
        default: "12"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stfeols-autonomous-completion-v4.yml"

concurrency:
  group: stfixest-completion-v4-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
  STFIXEST_COMPLETION_PHASES: ${{ inputs.phases || '12' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  complete:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Select Python and make Codex CLI available ephemerally
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in python3.13 python3.12 python3.11 python3.10 python3 /usr/bin/python3; do
            if ! command -v "$candidate" >/dev/null 2>&1; then
              continue
            fi
            if "$candidate" - <<'PY'
          import sys
          raise SystemExit(0 if sys.version_info >= (3, 10) else 1)
          PY
            then
              selected="$(command -v "$candidate")"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo "No Python >=3.10 is available." >&2
            exit 1
          fi
          echo "python=$selected" >> "$GITHUB_OUTPUT"
          "$selected" --version

          if command -v codex >/dev/null 2>&1; then
            codex_path="$(command -v codex)"
          else
            if ! command -v npm >/dev/null 2>&1; then
              echo "Codex is absent and npm is unavailable for an ephemeral bootstrap." >&2
              exit 1
            fi
            prefix="$RUNNER_TEMP/stfixest-codex-cli"
            npm install --no-audit --no-fund --prefix "$prefix" @openai/codex@latest
            codex_path="$prefix/node_modules/.bin/codex"
            if [[ ! -x "$codex_path" ]]; then
              echo "Ephemeral Codex bootstrap did not produce an executable." >&2
              exit 1
            fi
            echo "$(dirname "$codex_path")" >> "$GITHUB_PATH"
          fi
          echo "codex=$codex_path" >> "$GITHUB_OUTPUT"
          "$codex_path" --version
          "$codex_path" exec --help >/dev/null

      - name: Run guarded completion phases
        shell: bash
        run: "${{ steps.tools.outputs.python }} scripts/development/stfeols_autonomous_completion.py"

      - name: Upload private diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stfeols-completion-v4-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci/stata/run/
            .ci/dev/stfeols-completion-orchestrator.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Continue only after a clean guarded phase cap
        if: failure()
        shell: bash
        env:
          PYTHON: ${{ steps.tools.outputs.python }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          should_continue="$($PYTHON - <<'PY'
          import json
          from pathlib import Path
          report = Path('.ci/dev/stfeols-completion-orchestrator.json')
          if not report.is_file():
              print('false')
          else:
              document = json.loads(report.read_text(encoding='utf-8'))
              print('true' if document.get('status') == 'phase_cap' else 'false')
          PY
          )"
          if [[ "$should_continue" != true ]]; then
            echo "Failure was not a clean phase-cap stop; no automatic continuation."
            exit 0
          fi
          $PYTHON - <<'PY'
          import json
          import os
          import urllib.request
          url = (
              f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}/actions/"
              "workflows/stfeols-autonomous-completion-v4.yml/dispatches"
          )
          request = urllib.request.Request(
              url,
              data=json.dumps({'ref': 'main', 'inputs': {'phases': '12'}}).encode(),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'stfixest-completion-v4-continuation',
              },
              method='POST',
          )
          with urllib.request.urlopen(request):
              pass
          print('Dispatched the next bounded completion run.')
          PY
