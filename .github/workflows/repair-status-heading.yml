name: Record successful FE-interaction reference gate

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-status-heading.yml

permissions:
  contents: write

concurrency:
  group: stfixest-record-fe-reference-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 10
    steps:
      - name: Check out exact transform source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Publish truthful status transition on current main
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          TRANSFORM_ZLIB_B64: 
        run: |
          set -euo pipefail
          transform="$RUNNER_TEMP/record-fe-reference-status.py"
          TRANSFORM_PATH="$transform" /usr/bin/python3 -c 'import base64, os, pathlib, zlib; pathlib.Path(os.environ["TRANSFORM_PATH"]).write_bytes(zlib.decompress(base64.b64decode(os.environ["TRANSFORM_ZLIB_B64"], validate=True)))'
          publish_tree=""
          cleanup() {
            if [[ -n "$publish_tree" ]]; then
              git worktree remove --force "$publish_tree" 2>/dev/null || true
              git worktree prune
              publish_tree=""
            fi
          }
          trap cleanup EXIT

          for attempt in 1 2 3; do
            git fetch origin "$BRANCH_NAME"
            publish_tree="$RUNNER_TEMP/fe-reference-status-$attempt"
            git worktree add --detach "$publish_tree" "origin/$BRANCH_NAME"
            (
              cd "$publish_tree"
              /usr/bin/python3 "$transform"
            )
            git -C "$publish_tree" config user.name "github-actions[bot]"
            git -C "$publish_tree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$publish_tree" add -A
            git -C "$publish_tree" diff --cached --check
            if git -C "$publish_tree" diff --cached --quiet; then
              exit 0
            fi
            git -C "$publish_tree" commit -m "docs: record successful FE-interaction reference gate"
            if git -C "$publish_tree" push origin "HEAD:refs/heads/$BRANCH_NAME"; then
              exit 0
            fi
            cleanup
          done
          echo "FE-reference status publication lost three branch races" >&2
          exit 1
