name: Deduplicate FWL clippy annotation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dedupe-fwl-clippy.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Deduplicate annotation and validate
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/stfixest-core/src/ols/prepared_fit.rs")
          text = path.read_text(encoding="utf-8")
          duplicate = (
              "#[allow(clippy::too_many_arguments)]\n"
              "#[allow(clippy::too_many_arguments)]\n"
              "fn fit_scaled_pivoted_qr"
          )
          single = "#[allow(clippy::too_many_arguments)]\nfn fit_scaled_pivoted_qr"
          if text.count(duplicate) != 1:
              raise SystemExit("duplicate FWL annotation anchor is not unique")
          path.write_text(text.replace(duplicate, single, 1), encoding="utf-8")
          Path(".github/workflows/dedupe-fwl-clippy.yml").unlink()
          PY

          toolchain_root="$(/opt/homebrew/bin/rustup run 1.85.1 rustc --print sysroot)"
          export PATH="$toolchain_root/bin:/opt/homebrew/bin:$PATH"
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Commit cleanup directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/stfixest-core/src/ols/prepared_fit.rs
          git add -u .github/workflows/dedupe-fwl-clippy.yml
          git commit -m "core: deduplicate FWL score lint annotation"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
