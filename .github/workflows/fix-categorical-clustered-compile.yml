name: Fix categorical clustered compile cleanup

on:
  push:
    branches:
      - codex/categorical-interactions
    paths:
      - .github/workflows/fix-categorical-clustered-compile.yml

permissions:
  contents: write

concurrency:
  group: stfixest-categorical-cluster-compile-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 20
    steps:
      - name: Check out compile-fix checkpoint
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply, format, and push compile cleanup
        id: apply_fix
        continue-on-error: true
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          root = Path.cwd()
          clustered = root / "crates/stfixest-core/src/ols/prepared_clustered.rs"
          inference = root / "crates/stfixest-core/src/ols/prepared_inference_view.rs"
          unadjusted = root / "crates/stfixest-core/src/ols/prepared_unadjusted.rs"

          replace_once(
              clustered,
              "fn compose<R: PreparedInferenceReservation>(\n",
              "#[cfg(test)]\nfn compose<R: PreparedInferenceReservation>(\n",
              "test-only clustered compose",
          )
          replace_once(
              clustered,
              "        let fit = fit_prepared_ols_coefficients_map(prepared.ols(), config.fit)?;\n",
              "        let fit = fit_prepared_ols_coefficients_view_map(prepared.ols(), config.fit)?;\n",
              "clustered mutation-test coefficient helper",
          )
          replace_once(
              inference,
              "pub(super) fn validate_cluster_aware_legacy_absorbed_dof_summary(\n"
              "    prepared: &PreparedOlsData,\n"
              "    report: &PreparedOlsAbsorbedDofReport,\n"
              "    expected_policy: PreparedOlsAbsorbedDofPolicy,\n"
              ") -> Result<PreparedOlsAbsorbedDofSummary> {\n"
              "    prepared.inference_clustered_absorbed_dof_summary(report, expected_policy)\n"
              "}\n\n",
              "",
              "obsolete cluster-aware legacy DoF wrapper",
          )
          replace_once(
              unadjusted,
              "use super::prepared_inference_view::{\n"
              "    validate_cluster_aware_legacy_absorbed_dof_summary, PreparedOlsAbsorbedDofSummary,\n"
              "    PreparedOlsInferenceView,\n"
              "};\n",
              "use super::prepared_inference_view::{\n"
              "    PreparedOlsAbsorbedDofSummary, PreparedOlsInferenceView,\n"
              "};\n",
              "obsolete cluster-aware DoF import",
          )
          replace_once(
              unadjusted,
              "pub(super) fn build_reference_weight_report<'a>(\n"
              "    prepared: &'a PreparedOlsData,\n"
              "    fit: &CertifiedPreparedOlsFit,\n"
              "    tolerance: f64,\n"
              "    allow_probability: bool,\n"
              ") -> Result<(\n"
              "    PreparedOlsReferenceWeightReport,\n"
              "    ReferenceWeightView<'a>,\n"
              "    f64,\n"
              ")> {\n"
              "    build_reference_weight_report_view(prepared, fit, tolerance, allow_probability)\n"
              "}\n\n",
              "",
              "obsolete reference-weight wrapper",
          )
          replace_once(
              unadjusted,
              "pub(super) fn build_clustered_base_residual_dof(\n"
              "    prepared: &PreparedOlsData,\n"
              "    fit: &CertifiedPreparedOlsFit,\n"
              "    absorbed: &PreparedOlsAbsorbedDofReport,\n"
              "    weights: PreparedOlsReferenceWeightReport,\n"
              ") -> Result<PreparedOlsResidualDofReport> {\n"
              "    let summary =\n"
              "        validate_cluster_aware_legacy_absorbed_dof_summary(prepared, absorbed, absorbed.policy)?;\n"
              "    build_residual_dof_view(prepared, fit, summary, weights)\n"
              "}\n\n",
              "",
              "obsolete clustered residual-DoF wrapper",
          )
          PY

          toolchain_root="$(/opt/homebrew/bin/rustup run 1.85.1 rustc --print sysroot)"
          export PATH="$toolchain_root/bin:/opt/homebrew/bin:$PATH"
          cargo fmt --all
          rm .github/workflows/fix-categorical-clustered-compile.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "compile cleanup produced no changes" >&2; exit 1; }
          git commit -m "ols: clean generic clustered inference wrappers"
          git fetch origin "refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}"
          git rebase "refs/remotes/origin/${BRANCH_NAME}"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"

      - name: Publish compile-fix failure marker
        if: steps.apply_fix.outcome == 'failure'
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/categorical-cluster-compile-failure.json"
          /usr/bin/python3 - <<'PY' > "$payload"
          import json
          import os
          print(json.dumps({
              "schema": 1,
              "status": "failure",
              "staging_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "branch": os.environ["GITHUB_REF_NAME"],
          }, indent=2, sort_keys=True))
          PY
          git fetch origin "$BRANCH_NAME"
          publish="$RUNNER_TEMP/categorical-cluster-compile-publish"
          git worktree add --detach "$publish" "origin/$BRANCH_NAME"
          mkdir -p "$publish/.ci/source-transform/results"
          cp "$payload" "$publish/.ci/source-transform/results/$GITHUB_SHA.json"
          git -C "$publish" config user.name "github-actions[bot]"
          git -C "$publish" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish" add ".ci/source-transform/results/$GITHUB_SHA.json"
          git -C "$publish" commit -m "ci(source-transform): record ${GITHUB_SHA:0:12} compile failure [skip ci]"
          git -C "$publish" push origin "HEAD:refs/heads/$BRANCH_NAME"
          git worktree remove --force "$publish"

      - name: Enforce compile-fix success
        if: steps.apply_fix.outcome == 'failure'
        run: exit 1
