name: Repair recovered baseline

on:
  push:
    branches:
      - codex/full-implementation
    paths:
      - '.github/workflows/baseline-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/full-implementation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt
      - name: Apply deterministic baseline repairs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/mock_spi/run_actual_unix_plugin_test.sh')
          text = path.read_text()
          old = '    EXTRA_LIBS=()\n'
          new = '    EXTRA_LIBS=(-lc)\n'
          if old not in text:
              raise SystemExit('expected macOS empty-library array not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates tests/mock_spi/run_actual_unix_plugin_test.sh
          if ! git diff --cached --quiet; then
            git commit -m 'fix: format Rust sources and repair macOS loader harness'
            git push origin HEAD:codex/full-implementation
          fi
