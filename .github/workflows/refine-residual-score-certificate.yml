name: Refine prepared residual score certificate

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refine-residual-score-certificate.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply bounded residual refinement
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/stfixest-core/src/ols/prepared_fit.rs")
          text = path.read_text(encoding="utf-8")
          old = '''    let residual_absorbed =
        prepared.fit_absorb_matrix(weights.borrowed(), residual_matrix, config.map)?;
    if !residual_absorbed.report().certified() {
        return Err(invalid_data(
            "prepared OLS residual absorption returned an uncertified result",
        ));
    }
    let (mut residuals, residual_absorption_report) = residual_absorbed.into_parts();
    if perturbations.final_residual_constant {
        for row in 0..residuals.nrows() {
            residuals[(row, 0)] += 0.25;
        }
    }
    let score_certificate = certify_scores(
        prepared,
        residuals.as_slice(),
        weights,
        &reference_norms,
        &score_norms,
        &qr.generated_statuses,
        within_outcome_norm,
        config.score_tolerance,
    )?;
    if !score_certificate.passed {
        return Err(invalid_data(
            "prepared OLS finite score certificate did not pass",
        ));
    }
'''
          new = '''    let residual_absorbed =
        prepared.fit_absorb_matrix(weights.borrowed(), residual_matrix, config.map)?;
    if !residual_absorbed.report().certified() {
        return Err(invalid_data(
            "prepared OLS residual absorption returned an uncertified result",
        ));
    }
    let (mut residuals, mut residual_absorption_report) = residual_absorbed.into_parts();
    let mut score_certificate = certify_scores(
        prepared,
        residuals.as_slice(),
        weights,
        &reference_norms,
        &score_norms,
        &qr.generated_statuses,
        within_outcome_norm,
        config.score_tolerance,
    )?;

    // A residual can pass the FE certificate at the requested MAP tolerance
    // while its remaining FE leakage is amplified by a raw regressor with a
    // much larger between-FE than within-FE component. The finite score remains
    // fail-closed: refine the already residualized vector at progressively
    // stricter FE tolerances and require the original score tolerance to pass.
    // This allocates no additional observation-by-regressor object and runs
    // only after the first full score certificate fails.
    let mut refinement_tolerance = config.map.tolerance;
    for _ in 0..3 {
        if score_certificate.passed {
            break;
        }
        let next_tolerance = refinement_tolerance * 0.1;
        if !next_tolerance.is_finite()
            || next_tolerance <= 0.0
            || next_tolerance >= refinement_tolerance
        {
            break;
        }
        let refined = prepared.fit_absorb_matrix(
            weights.borrowed(),
            residuals,
            MapConfig {
                tolerance: next_tolerance,
                ..config.map
            },
        )?;
        if !refined.report().certified() {
            return Err(invalid_data(
                "prepared OLS refined residual absorption returned an uncertified result",
            ));
        }
        let (refined_residuals, mut refined_report) = refined.into_parts();
        refined_report.iterations = residual_absorption_report
            .iterations
            .checked_add(refined_report.iterations)
            .ok_or_else(|| allocation("prepared OLS residual refinement iterations overflow"))?;
        refined_report.setup_seconds += residual_absorption_report.setup_seconds;
        refined_report.solve_seconds += residual_absorption_report.solve_seconds;
        if !refined_report.setup_seconds.is_finite() || !refined_report.solve_seconds.is_finite() {
            return Err(invalid_data(
                "prepared OLS residual refinement timing is not finite",
            ));
        }
        residuals = refined_residuals;
        residual_absorption_report = refined_report;
        refinement_tolerance = next_tolerance;
        score_certificate = certify_scores(
            prepared,
            residuals.as_slice(),
            weights,
            &reference_norms,
            &score_norms,
            &qr.generated_statuses,
            within_outcome_norm,
            config.score_tolerance,
        )?;
    }

    // Perturbations are applied only after every production refinement so the
    // failure-injection certificate cannot be repaired away by another FE pass.
    if perturbations.final_residual_constant {
        for row in 0..residuals.nrows() {
            residuals[(row, 0)] += 0.25;
        }
        score_certificate = certify_scores(
            prepared,
            residuals.as_slice(),
            weights,
            &reference_norms,
            &score_norms,
            &qr.generated_statuses,
            within_outcome_norm,
            config.score_tolerance,
        )?;
    }
    if !score_certificate.passed {
        return Err(invalid_data(
            "prepared OLS finite score certificate did not pass",
        ));
    }
'''
          if text.count(old) != 1:
              raise SystemExit("residual score block anchor is not unique")
          path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/refine-residual-score-certificate.yml").unlink()
          PY

          toolchain_root="$(/opt/homebrew/bin/rustup run 1.85.1 rustc --print sysroot)"
          export PATH="$toolchain_root/bin:/opt/homebrew/bin:$PATH"
          cargo fmt --all
          cargo test -p stfixest-core allocation_capacity_and_score_failures_are_fatal --no-default-features
          cargo test -p stfixest-core zero_within_norm_column_still_checks_its_raw_score_moment --no-default-features

      - name: Commit refinement directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898288+github-actions[bot]@users.noreply.github.com"
          git add crates/stfixest-core/src/ols/prepared_fit.rs
          git add -u .github/workflows/refine-residual-score-certificate.yml
          git commit -m "core: refine residuals until finite scores certify"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
