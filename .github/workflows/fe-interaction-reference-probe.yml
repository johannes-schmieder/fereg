name: Pinned reghdfe FE-interaction probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fe-interaction-reference-probe.yml
      - scripts/fe_interaction_probe.py
      - scripts/materialize_bundled_reference_root.py
      - scripts/resolve_reference_root.py
      - tests/python/test_fe_interaction_probe_contract.py
      - tests/python/test_bundled_reference_root_contract.py
      - tests/python/test_reference_root_resolver_contract.py
      - ci/reference-bundles/stata-require/**
      - ci/reference-probes/triggers/bundled-reference-v1.txt
      - benchmarks/stata/probe_reghdfe_fe_interaction.do
      - benchmarks/stata/baseline_reghdfe.do
      - benchmarks/manifests/ols_v1.json
      - references.lock.toml
      - tests/fixtures/ols/ols_core.csv
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fereg-fe-interaction-probe-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'johannes-schmieder/fereg'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, fereg]
    timeout-minutes: 30
    steps:
      - name: Check out exact probe source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Initialize durable probe status
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/fereg-fe-interaction-probe"
          rm -rf "$output"
          mkdir -p "$output"
          OUTPUT="$output/summary.json" /usr/bin/python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "receipt_type": "fereg-reghdfe-fe-interaction-probe",
              "status": "failure",
              "source_sha": os.environ["GITHUB_SHA"],
              "stage": "workflow_started",
              "failure_kind": "probe_not_completed",
              "failure_detail": "reference probe did not reach a terminal result",
              "raw_capture_committed": False,
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }
          canonical = json.dumps(
              payload,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
          ).encode("utf-8")
          document = {
              "payload": payload,
              "payload_sha256": hashlib.sha256(canonical).hexdigest(),
          }
          Path(os.environ["OUTPUT"]).write_text(
              json.dumps(document, indent=2, sort_keys=True, ensure_ascii=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Select Python with tomllib
        id: python
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            /opt/homebrew/bin/python3
            /usr/local/bin/python3
            "$(command -v python3 2>/dev/null || true)"
            /usr/bin/python3
          )
          for candidate in "${candidates[@]}"; do
            [[ -n "$candidate" && -x "$candidate" ]] || continue
            if "$candidate" -c 'import sys, tomllib; assert sys.version_info >= (3, 11)' >/dev/null 2>&1; then
              echo "bin=$candidate" >> "$GITHUB_OUTPUT"
              "$candidate" --version
              exit 0
            fi
          done
          echo "No Python interpreter with tomllib is available on the trusted runner." >&2
          exit 1

      - name: Resolve or materialize offline pinned reference root
        id: reference_root
        if: steps.python.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          PROBE_PYTHON: ${{ steps.python.outputs.bin }}
        run: |
          set -euo pipefail
          root_file="$RUNNER_TEMP/fereg-reference-root.path"
          materialize_parent="$RUNNER_TEMP/fereg-reference-materialized"
          bundled_resolver="scripts/materialize_bundled_reference_root.py"
          fallback_resolver="scripts/resolve_reference_root.py"
          rm -f "$root_file"
          rm -rf "$materialize_parent"
          mkdir -m 700 "$materialize_parent"
          "$PROBE_PYTHON" -m py_compile \
            "$bundled_resolver" \
            "$fallback_resolver" \
            scripts/ols_reference.py

          bundled_outcome="failure"
          if "$PROBE_PYTHON" "$bundled_resolver" \
            --output "$root_file" \
            --materialize-parent "$materialize_parent"; then
            bundled_outcome="success"
          else
            rm -f "$root_file"
            rm -rf "$materialize_parent"
            mkdir -m 700 "$materialize_parent"
            "$PROBE_PYTHON" "$fallback_resolver" \
              --output "$root_file" \
              --materialize-parent "$materialize_parent"
          fi
          chmod 600 "$root_file"
          echo "file=$root_file" >> "$GITHUB_OUTPUT"
          echo "bundled_outcome=$bundled_outcome" >> "$GITHUB_OUTPUT"

      - name: Run isolated pinned reference probe
        id: probe
        if: steps.python.outcome == 'success' && steps.reference_root.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          PROBE_PYTHON: ${{ steps.python.outputs.bin }}
          REFERENCE_ROOT_FILE: ${{ steps.reference_root.outputs.file }}
          STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/fereg-fe-interaction-probe"
          export FEREG_REFERENCE_ROOT="$(cat "$REFERENCE_ROOT_FILE")"
          "$PROBE_PYTHON" -m py_compile scripts/fe_interaction_probe.py scripts/ols_reference.py
          "$PROBE_PYTHON" scripts/fe_interaction_probe.py \
            --stata "$STATA_BIN" \
            --output-dir "$output" \
            --source-sha "$GITHUB_SHA"
          unset FEREG_REFERENCE_ROOT

      - name: Finalize missing or malformed probe status
        if: always()
        shell: bash
        env:
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          REFERENCE_ROOT_OUTCOME: ${{ steps.reference_root.outcome }}
          BUNDLED_REFERENCE_OUTCOME: ${{ steps.reference_root.outputs.bundled_outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/fereg-fe-interaction-probe"
          mkdir -p "$output"
          OUTPUT="$output/summary.json" /usr/bin/python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["OUTPUT"])
          reason = None
          detail = "reference probe did not create a valid source-bound summary"
          try:
              document = json.loads(path.read_text(encoding="utf-8"))
              payload = document.get("payload", {})
              if payload.get("source_sha") != os.environ["GITHUB_SHA"]:
                  reason = "summary_source_sha_mismatch"
              elif payload.get("raw_capture_committed") is not False:
                  reason = "summary_raw_capture_policy_violation"
              elif payload.get("status") not in {"success", "failure"}:
                  reason = "summary_status_invalid"
              elif payload.get("stage") == "workflow_started":
                  if os.environ.get("PYTHON_OUTCOME") != "success":
                      reason = "python_tomllib_unavailable"
                      detail = "no trusted runner Python interpreter could import tomllib"
                  elif os.environ.get("REFERENCE_ROOT_OUTCOME") != "success":
                      reason = "offline_reference_root_unresolved"
                      detail = "no bundled or allowlisted local reference root passed exact offline preflight"
                  elif os.environ.get("PROBE_OUTCOME") != "success":
                      reason = "probe_process_failed_before_summary"
                      detail = "reference probe process failed before writing a terminal summary"
                  else:
                      reason = "probe_process_did_not_replace_initial_summary"
                      detail = "reference probe returned success without replacing its initialized summary"
              elif os.environ.get("PROBE_OUTCOME") != "success" and payload.get("status") == "success":
                  reason = "probe_process_failed_after_success_summary"
          except (OSError, UnicodeError, json.JSONDecodeError, AttributeError, TypeError):
              reason = "summary_missing_or_malformed"

          if reason is not None:
              payload = {
                  "schema_version": 1,
                  "receipt_type": "fereg-reghdfe-fe-interaction-probe",
                  "status": "failure",
                  "source_sha": os.environ["GITHUB_SHA"],
                  "stage": "workflow_finalizer",
                  "failure_kind": reason,
                  "failure_detail": detail,
                  "raw_capture_committed": False,
                  "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "python_outcome": os.environ.get("PYTHON_OUTCOME", "unknown"),
                  "reference_root_outcome": os.environ.get("REFERENCE_ROOT_OUTCOME", "unknown"),
                  "bundled_reference_outcome": os.environ.get(
                      "BUNDLED_REFERENCE_OUTCOME", "unknown"
                  ),
                  "probe_outcome": os.environ.get("PROBE_OUTCOME", "unknown"),
              }
              canonical = json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
              ).encode("utf-8")
              document = {
                  "payload": payload,
                  "payload_sha256": hashlib.sha256(canonical).hexdigest(),
              }
              path.write_text(
                  json.dumps(document, indent=2, sort_keys=True, ensure_ascii=True) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Upload temporary probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fe-interaction-probe-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fereg-fe-interaction-probe/
          if-no-files-found: error
          retention-days: 30

      - name: Publish redacted source-bound probe summary
        if: always()
        shell: bash
        env:
          SUMMARY: ${{ runner.temp }}/fereg-fe-interaction-probe/summary.json
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          document = json.loads(Path(os.environ["SUMMARY"]).read_text(encoding="utf-8"))
          payload = document.get("payload", {})
          if payload.get("source_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("probe summary source SHA mismatch")
          if payload.get("raw_capture_committed") is not False:
              raise SystemExit("probe summary violates raw-capture policy")
          payload_sha256 = document.get("payload_sha256")
          if payload_sha256 is not None:
              canonical = json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
              ).encode("utf-8")
              if payload_sha256 != hashlib.sha256(canonical).hexdigest():
                  raise SystemExit("probe summary payload digest mismatch")
          PY

          result_path=".ci/reference-probes/fe-interaction/$GITHUB_SHA.json"
          publish_tree=""
          cleanup() {
            if [[ -n "$publish_tree" ]]; then
              git worktree remove --force "$publish_tree" 2>/dev/null || true
              git worktree prune
              publish_tree=""
            fi
          }
          trap cleanup EXIT

          for attempt in 1 2 3; do
            git fetch origin "$BRANCH_NAME"
            publish_tree="$RUNNER_TEMP/fe-interaction-probe-publish-$attempt"
            git worktree add --detach "$publish_tree" "origin/$BRANCH_NAME"
            mkdir -p "$publish_tree/$(dirname "$result_path")"
            cp "$SUMMARY" "$publish_tree/$result_path"
            git -C "$publish_tree" config user.name "github-actions[bot]"
            git -C "$publish_tree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$publish_tree" add "$result_path"
            if git -C "$publish_tree" diff --cached --quiet; then
              exit 0
            fi
            git -C "$publish_tree" commit -m "ci(reference): record ${GITHUB_SHA:0:12} FE probe [skip ci]"
            if git -C "$publish_tree" push origin "HEAD:refs/heads/$BRANCH_NAME"; then
              exit 0
            fi
            cleanup
          done
          echo "reference-probe publication lost three branch races" >&2
          exit 1

      - name: Enforce probe success
        if: always()
        shell: bash
        env:
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          REFERENCE_ROOT_OUTCOME: ${{ steps.reference_root.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          SUMMARY: ${{ runner.temp }}/fereg-fe-interaction-probe/summary.json
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          document = json.loads(Path(os.environ["SUMMARY"]).read_text(encoding="utf-8"))
          if os.environ["PYTHON_OUTCOME"] != "success":
              raise SystemExit("reference probe Python capability check failed")
          if os.environ["REFERENCE_ROOT_OUTCOME"] != "success":
              raise SystemExit("offline reference root resolution failed")
          if os.environ["PROBE_OUTCOME"] != "success":
              raise SystemExit("reference probe process failed")
          if document.get("payload", {}).get("status") != "success":
              raise SystemExit("reference probe summary is not successful")
          PY
