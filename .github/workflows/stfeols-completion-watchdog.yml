name: Watch stfeols completion transaction

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: stfixest-stfeols-watchdog
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Stop on completion or surface a scientific decision
        id: state
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/stfeols-v1-complete >/dev/null; then
            echo "done=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if test -f SCIENTIFIC_QUESTION.md; then
            title="stfeols scientific decision required"
            if ! gh issue list --state open --search '"stfeols scientific decision required" in:title' \
                 --json title --jq '.[].title' | grep -Fxq "$title"; then
              gh issue create --title "$title" --body-file SCIENTIFIC_QUESTION.md
            fi
            echo "question=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          active=0
          for workflow in \
            .github/workflows/stfeols-autonomous-completion-v2.yml \
            .github/workflows/codex-next-stfeols-gate.yml
          do
            count="$(gh run list --workflow "$workflow" --limit 20 --json status \
              --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
            active=$((active + count))
          done
          if test "$active" -gt 0; then
            echo "active=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          workflow=.github/workflows/stfeols-autonomous-completion-v2.yml
          latest_conclusion="$(gh run list --workflow "$workflow" --limit 1 \
            --json conclusion --jq '.[0].conclusion // "none"')"
          echo "latest_conclusion=$latest_conclusion" >> "$GITHUB_OUTPUT"
          echo "inactive=1" >> "$GITHUB_OUTPUT"

      - name: Finalize a successful transaction whose finalizer was interrupted
        if: >-
          steps.state.outputs.inactive == '1' &&
          steps.state.outputs.latest_conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -f ci/check_stfeols_completion.py
          /usr/bin/python3 ci/check_stfeols_completion.py
          /usr/bin/python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          receipt = json.loads(Path('.ci/stata/latest.json').read_text())
          for key, expected in {
              'profile': 'full',
              'status': 'success',
              'stata_status': 'success',
              'rust_status': 'success',
              'tests_failed': 0,
          }.items():
              if receipt.get(key) != expected:
                  raise SystemExit(f'latest receipt {key} is not final-green')
          tested = receipt.get('tested_sha')
          subprocess.run(['git', 'merge-base', '--is-ancestor', tested, 'HEAD'], check=True)
          command = [
              'git', 'diff', '--quiet', f'{tested}..HEAD', '--', '.',
              ':(exclude).ci/stata/results/**',
              ':(exclude).ci/stata/latest.json',
              ':(exclude)STATUS.md',
          ]
          if subprocess.run(command).returncode:
              raise SystemExit('source drift follows the full tested candidate')
          PY
          git tag -a stfeols-v1-complete HEAD -m "Verified public stfeols OLS 1.0 completion"
          git push origin refs/tags/stfeols-v1-complete

      - name: Retrigger an inactive failed transaction within the bounded budget
        if: >-
          steps.state.outputs.inactive == '1' &&
          steps.state.outputs.latest_conclusion != 'success'
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          if test -f .ci/stfeols-agent-state.json; then
            pass="$(/usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              print(int(json.loads(Path('.ci/stfeols-agent-state.json').read_text()).get('recovery_pass', 0)))
          except Exception:
              print(0)
          PY
            )"
          fi
          if test "$pass" -ge 5; then
            title="stfeols completion requires operator action"
            body="$RUNNER_TEMP/operator-action.md"
            {
              echo "The bounded autonomous completion transaction exhausted five recovery passes."
              echo
              echo "Inspect the private workflow artifacts and .ci/stfeols-agent-state.json."
              echo "No unqualified estimator source was pushed to main."
            } > "$body"
            if ! gh issue list --state open --search '"stfeols completion requires operator action" in:title' \
                 --json title --jq '.[].title' | grep -Fxq "$title"; then
              gh issue create --title "$title" --body-file "$body"
            fi
            exit 1
          fi

          driver=.github/workflows/stfeols-autonomous-completion-v2.yml
          /usr/bin/python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          state_path = Path('.ci/stfeols-watchdog-state.json')
          try:
              state = json.loads(state_path.read_text())
          except Exception:
              state = {'schema_version': 1, 'kicks': 0}
          state['kicks'] = int(state.get('kicks', 0)) + 1
          state_path.parent.mkdir(parents=True, exist_ok=True)
          state_path.write_text(json.dumps(state, indent=2) + '\n')

          path = Path('.github/workflows/stfeols-autonomous-completion-v2.yml')
          text = path.read_text()
          text = re.sub(r'^# watchdog-kick: [0-9]+\n', '', text, flags=re.MULTILINE)
          marker = 'name: Complete stfeols transactionally on licensed runner\n'
          if text.count(marker) != 1:
              raise SystemExit('completion driver name anchor is not unique')
          text = text.replace(marker, marker + f'# watchdog-kick: {state["kicks"]}\n', 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$driver" .ci/stfeols-watchdog-state.json
          git commit -m "ci(stfeols): restart inactive completion transaction"
          git pull --rebase origin main
          git push origin HEAD:main
