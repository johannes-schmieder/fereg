name: Apply absorbed-intercept score repair v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-score-repair-v2.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply bounded source repair and remove one-shot scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          source = Path("crates/stfixest-core/src/ols/prepared_fit.rs")
          text = source.read_text(encoding="utf-8")

          score_start = text.index("fn certify_scores")
          score_end = text.index("\nfn compensated_add", score_start)
          score = text[score_start:score_end]
          old_denominator = (
              "        let denominator = if score_norm > 0.0 {\n"
              "            score_norm\n"
              "        } else {\n"
              "            reference_norm\n"
              "        };\n"
          )
          new_denominator = (
              "        let denominator = if status == PreparedOlsFitStatus::NormalizedAbsorbedIntercept {\n"
              "            reference_norm\n"
              "        } else if score_norm > 0.0 {\n"
              "            score_norm\n"
              "        } else {\n"
              "            reference_norm\n"
              "        };\n"
          )
          if new_denominator not in score:
              if score.count(old_denominator) != 1:
                  raise SystemExit("certify_scores denominator anchor is not unique")
              score = score.replace(old_denominator, new_denominator)

          old_comment = (
              "        // into a manufactured order-one moment. Deferred/normalized constants\n"
              "        // and finite rank-deficient coordinates remain explicitly checked.\n"
          )
          new_comment = (
              "        // into a manufactured order-one moment. A normalized absorbed intercept\n"
              "        // still keeps its raw score moment, but that moment uses the raw intercept\n"
              "        // norm instead of a numerically nonzero MAP-noise norm. Finite\n"
              "        // rank-deficient coordinates remain checked on their within scale.\n"
          )
          if old_comment in score:
              score = score.replace(old_comment, new_comment)
          text = text[:score_start] + score + text[score_end:]

          test_name = "fn normalized_absorbed_intercept_score_uses_raw_norm_under_map_roundoff()"
          if test_name not in text:
              anchor = "\n    #[test]\n    fn empty_sample_and_invalid_policy_fail_closed()"
              if text.count(anchor) != 1:
                  raise SystemExit("score regression-test insertion anchor is not unique")
              test = r'''

    #[test]
    fn normalized_absorbed_intercept_score_uses_raw_norm_under_map_roundoff() {
        let g = vec![1.0, 1.0, 1.0, 2.0, 2.0, 2.0];
        let y = vec![9.0, 10.0, 11.0, 18.0, 20.0, 22.0];
        let prepared = prepared(&y, &[], &[], Some(&g), true, TestWeights::Unit);
        let weights = normalized_weights(&prepared).expect("weights");
        let rhs = prepared.fit_build_rhs().expect("rhs");
        let reference_norm = weighted_matrix_column_norm(&rhs, 1, weights)
            .expect("reference intercept norm");
        let score_norm = reference_norm * 1e-14;
        let statuses = [PreparedOlsFitStatus::NormalizedAbsorbedIntercept];

        let roundoff_residuals = vec![1e-14; y.len()];
        let roundoff = certify_scores(
            &prepared,
            &roundoff_residuals,
            weights,
            &[reference_norm],
            &[score_norm],
            &statuses,
            1.0,
            PreparedOlsFitConfig::default().score_tolerance,
        )
        .expect("roundoff score certificate");
        assert_eq!(roundoff.moments, 1);
        assert!(roundoff.passed);
        assert!(roundoff.relative_infinity_norm < 1e-12);

        let material_residuals = vec![1e-6; y.len()];
        let material = certify_scores(
            &prepared,
            &material_residuals,
            weights,
            &[reference_norm],
            &[score_norm],
            &statuses,
            1.0,
            PreparedOlsFitConfig::default().score_tolerance,
        )
        .expect("material score certificate");
        assert!(!material.passed);
    }
'''
              text = text.replace(anchor, test + anchor)
          source.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/stata-ci.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          marker = "\n  # BEGIN ONE-SHOT ABSORBED-INTERCEPT SCORE REPAIR\n"
          if marker in workflow_text:
              workflow.write_text(workflow_text.split(marker, 1)[0] + "\n", encoding="utf-8")

          for path in (
              Path(".github/workflows/repair-prepared-score-intercept.yml"),
              Path(".github/workflows/apply-score-repair-v2.yml"),
          ):
              if path.exists():
                  path.unlink()
          PY
          cargo fmt --all
          cargo test -p stfixest-core normalized_absorbed_intercept_score_uses_raw_norm_under_map_roundoff
          cargo test -p stfixest-core zero_within_norm_column_still_checks_its_raw_score_moment

      - name: Commit repair directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "core: stabilize absorbed-intercept score certificate"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
