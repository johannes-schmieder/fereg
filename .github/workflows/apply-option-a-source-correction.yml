name: Apply option A absorbed-slope source correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-option-a-source-correction.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: stfixest-option-a-source-correction-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  correct:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Cancel stale bounded coding-agent runs
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "stfixest-option-a-source-correction",
          }
          base = f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}"

          def call(url: str, method: str = "GET") -> dict:
              request = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request) as response:
                      payload = response.read()
              except urllib.error.HTTPError as error:
                  if error.code in (409, 422):
                      return {}
                  raise
              return json.loads(payload) if payload else {}

          cancelled = []
          for status in ("queued", "in_progress"):
              runs = call(
                  f"{base}/actions/runs?branch=main&status={status}&per_page=100"
              ).get("workflow_runs", [])
              for run in runs:
                  if run.get("name") != "Run one bounded coding-agent stfeols gate":
                      continue
                  call(f"{base}/actions/runs/{run['id']}/cancel", "POST")
                  cancelled.append(run["id"])
          print(json.dumps({"cancelled_bounded_agent_runs": cancelled}))
          PY

      - name: Apply guarded transform and targeted preflight
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          log_file="$(mktemp)"
          cleanup() { rm -f "$log_file"; }
          trap cleanup EXIT

          set +e
          {
            /usr/bin/python3 ci/source-transforms/apply_option_a_absorbed_slope.py
            cargo fmt --all
            /usr/bin/python3 -m unittest \
              tests.python.test_intercept_slope_positive_dof_fixture \
              tests.python.test_categorical_hidden_transport_contract \
              tests.python.test_ols_hidden_numeric
            cargo test -p stfixest-testkit --test intercept_slope_oracle
          } >"$log_file" 2>&1
          rc=$?
          set -e

          if [[ $rc -ne 0 ]]; then
            {
              echo "Option-A source correction preflight failed with rc=$rc."
              echo
              echo '```text'
              tail -n 120 "$log_file" \
                | sed "s#${GITHUB_WORKSPACE}#<workspace>#g; s#${HOME}#<home>#g"
              echo '```'
            } >"${RUNNER_TEMP}/option-a-failure.md"
            gh issue comment 14 --repo "$GITHUB_REPOSITORY" \
              --body-file "${RUNNER_TEMP}/option-a-failure.md" || true
            exit "$rc"
          fi

          cat "$log_file"

      - name: Commit coherent option-A source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-option-a-source-correction.yml \
            .github/workflows/dispatch-option-a-source-correction.yml \
            ci/source-transforms/apply_option_a_absorbed_slope.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ols): enforce option A positive residual DoF"

          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              source_sha="$(git rev-parse HEAD)"
              gh issue comment 14 --repo "$GITHUB_REPOSITORY" --body \
                "Option-A source correction pushed as \`$source_sha\`. Exact-SHA Rust/Stata qualification is now pending." || true
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((2 * attempt))
          done
          exit 1
