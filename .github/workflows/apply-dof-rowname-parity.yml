name: Apply interaction DoF row-name parity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-dof-rowname-parity.yml

permissions:
  contents: write

concurrency:
  group: stfixest-apply-dof-rowname-parity-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 10
    steps:
      - name: Check out exact transform source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply source and fixture repair on current main
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          publish_tree=""
          cleanup() {
            if [[ -n "$publish_tree" ]]; then
              git worktree remove --force "$publish_tree" 2>/dev/null || true
              git worktree prune
              publish_tree=""
            fi
          }
          trap cleanup EXIT

          for attempt in 1 2 3; do
            git fetch origin "$BRANCH_NAME"
            publish_tree="$RUNNER_TEMP/dof-rowname-parity-$attempt"
            git worktree add --detach "$publish_tree" "origin/$BRANCH_NAME"
            PUBLISH_TREE="$publish_tree" /usr/bin/python3 - <<'PY'
import os
from pathlib import Path

root = Path(os.environ["PUBLISH_TREE"])

ado = root / "stata/_stfixest_estimate_ols_test.ado"
text = ado.read_text(encoding="utf-8")
old = '''            local dof_row_name : word `term' of `absorb_labels'
            local dof_row_name `"1.`dof_row_name'"'
'''
new = '''            local dof_row_name : word `term' of `absorb_labels'
            local dof_row_name = subinstr(`"`dof_row_name'"', "#", "#1.", .)
            local dof_row_name `"1.`dof_row_name'"'
'''
if text.count(old) != 1:
    raise SystemExit("hidden DoF row-name source anchor mismatch")
ado.write_text(text.replace(old, new, 1), encoding="utf-8")

fixture = root / "tests/stata/installation/estimate_ols_categorical_interaction.do"
text = fixture.read_text(encoding="utf-8")
old = '''assert e(stfixest_fe)[1,6] == e(df_a)
assert e(sample) == 1
'''
new = '''assert e(stfixest_fe)[1,6] == e(df_a)
local interaction_dof_rows : rowfullnames e(dof_table)
assert `"`interaction_dof_rows'"' == "1.firm#1.year"
assert e(sample) == 1
'''
if text.count(old) != 1:
    raise SystemExit("categorical fixture DoF row-name anchor mismatch")
fixture.write_text(text.replace(old, new, 1), encoding="utf-8")

(root / ".github/workflows/apply-dof-rowname-parity.yml").unlink()
PY
            git -C "$publish_tree" config user.name "github-actions[bot]"
            git -C "$publish_tree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$publish_tree" add -A
            git -C "$publish_tree" diff --cached --check
            git -C "$publish_tree" commit -m "stata: canonicalize interaction DoF row identity"
            if git -C "$publish_tree" push origin "HEAD:refs/heads/$BRANCH_NAME"; then
              exit 0
            fi
            cleanup
          done
          echo "DoF row-name transform lost three branch races" >&2
          exit 1
