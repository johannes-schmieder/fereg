name: Finalize verified stfeols completion

on:
  workflow_run:
    workflows:
      - Complete stfeols transactionally on licensed runner
    types:
      - completed

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: >-
      github.repository == 'johannes-schmieder/StFixest' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out clean main after the completion transaction
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify the committed completion state independently
        shell: bash
        run: |
          set -euo pipefail
          test -f ci/check_stfeols_completion.py
          /usr/bin/python3 ci/check_stfeols_completion.py
          /usr/bin/python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          receipt = json.loads(Path('.ci/stata/latest.json').read_text(encoding='utf-8'))
          required = {
              'profile': 'full',
              'status': 'success',
              'stata_status': 'success',
              'rust_status': 'success',
              'tests_failed': 0,
          }
          for key, value in required.items():
              if receipt.get(key) != value:
                  raise SystemExit(f'latest receipt {key}={receipt.get(key)!r}, expected {value!r}')
          if receipt.get('tested_sha') != __import__('subprocess').check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip():
              raise SystemExit('full completion receipt is not bound to clean main HEAD')

          public = Path('src/ado/stfeols.ado')
          if not public.exists():
              matches = list(Path('.').rglob('stfeols.ado'))
              if len(matches) != 1:
                  raise SystemExit(f'expected one public stfeols.ado, found {matches}')
              public = matches[0]
          text = public.read_text(encoding='utf-8')
          if re.search(r'\bexit\s+498\b', text):
              raise SystemExit('public stfeols still contains its fail-closed stub')

          for name in ('stfepois.ado',):
              matches = list(Path('.').rglob(name))
              if len(matches) != 1:
                  raise SystemExit(f'expected one {name}, found {matches}')
              ppml = matches[0].read_text(encoding='utf-8')
              if not re.search(r'\bexit\s+498\b', ppml):
                  raise SystemExit(f'{name} is not still fail-closed')
          PY

      - name: Record immutable completion tag and remove temporary supervisors
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          temporary = (
              '.github/workflows/apply-score-repair-v2.yml',
              '.github/workflows/apply-score-repair-v3.yml',
              '.github/workflows/apply-score-repair-v4.yml',
              '.github/workflows/close-fe-interaction-receipt-v1.yml',
              '.github/workflows/stfeols-autonomous-completion.yml',
              '.github/workflows/stfeols-autonomous-completion-v2.yml',
              '.github/workflows/harden-stfeols-driver-auth.yml',
              '.github/workflows/stfeols-completion-recovery.yml',
              '.github/workflows/stfeols-completion-recovery-v2.yml',
              '.github/workflows/prune-redundant-stata-ci.yml',
              '.github/workflows/prune-closed-one-shot-jobs.yml',
              '.github/workflows/cleanup-schema-probe.yml',
              '.github/stfeols_completion_prompt.md',
              '.ci/stfeols-agent-state.json',
          )
          for item in temporary:
              path = Path(item)
              if path.exists():
                  path.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci(stfeols): remove completion scaffolding [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          final_sha="$(git rev-parse HEAD)"
          git tag -a stfeols-v1-complete "$final_sha" \
            -m "Verified public stfeols OLS 1.0 completion; accepted source $source_sha"
          git push origin refs/tags/stfeols-v1-complete

      - name: Close accidental schema-probe issue if still present
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue list --state open --search '"DO NOT CREATE" in:title' --json number,title \
            --jq '.[] | select(.title == "DO NOT CREATE") | .number' |
          while read -r number; do
            test -n "$number" || continue
            gh issue close "$number" --comment "Closed: accidental connector schema probe; no project decision or work item."
          done
