name: Recover failed stfeols completion run

on:
  workflow_run:
    workflows:
      - Complete stfeols transactionally on licensed runner
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  recover:
    if: >-
      github.repository == 'johannes-schmieder/StFixest' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Capture a sanitized failure digest and retrigger once
        shell: bash
        run: |
          set -euo pipefail
          state=.ci/stfeols-agent-state.json
          pass=0
          if test -f "$state"; then
            pass="$(/usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              value = int(json.loads(Path('.ci/stfeols-agent-state.json').read_text()).get('recovery_pass', 0))
          except Exception:
              value = 0
          print(value)
          PY
            )"
          fi
          if test "$pass" -ge 1; then
            echo "The bounded stfeols recovery pass has already been used." >&2
            exit 1
          fi

          run_id='${{ github.event.workflow_run.id }}'
          attempt='${{ github.event.workflow_run.run_attempt }}'
          artifact="stfeols-completion-v2-$run_id-$attempt"
          mkdir -p "$RUNNER_TEMP/stfeols-recovery"
          gh run download "$run_id" --name "$artifact" --dir "$RUNNER_TEMP/stfeols-recovery" || true

          /usr/bin/python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path(__import__('os').environ['RUNNER_TEMP']) / 'stfeols-recovery'
          patterns = re.compile(
              r'(FAIL|ERROR|error:|panicked|assertion|r\([0-9]+\)|completion gate|'
              r'credential|authentication|not found|timed out|exit code)',
              re.IGNORECASE,
          )
          lines: list[str] = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.stat().st_size > 20_000_000:
                  continue
              try:
                  content = path.read_text(encoding='utf-8', errors='replace').splitlines()
              except OSError:
                  continue
              for line in content:
                  if patterns.search(line):
                      line = re.sub(r'\x1b\[[0-9;]*m', '', line)
                      line = re.sub(r'/Users/[^/\s]+', '/Users/<runner>', line)
                      line = re.sub(r'/home/runner', '/home/<runner>', line)
                      lines.append(line[-1200:])
          digest = lines[-120:]
          state = {
              'schema_version': 1,
              'recovery_pass': 1,
              'failed_run_id': int(__import__('os').environ.get('RUN_ID', '0') or 0),
              'failure_digest': digest,
              'raw_logs_committed': False,
          }
          path = Path('.ci/stfeols-agent-state.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')
          PY

          driver=.github/workflows/stfeols-autonomous-completion-v2.yml
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/stfeols-autonomous-completion-v2.yml')
          text = path.read_text(encoding='utf-8')
          marker = 'name: Complete stfeols transactionally on licensed runner\n'
          replacement = marker + '# recovery-pass: 1\n'
          if '# recovery-pass: 1\n' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('completion driver name anchor is not unique')
              text = text.replace(marker, replacement, 1)
          context_anchor = "              printf 'Implement and fully test the first incomplete gate. Do not merely describe it.\\n'\n"
          context = (
              "              if test -f .ci/stfeols-agent-state.json; then\n"
              "                printf 'Sanitized prior-run failure digest:\\n```json\\n'\n"
              "                cat .ci/stfeols-agent-state.json\n"
              "                printf '```\\n\\n'\n"
              "              fi\n"
          )
          if context not in text:
              if text.count(context_anchor) != 1:
                  raise SystemExit('completion driver prompt anchor is not unique')
              text = text.replace(context_anchor, context + context_anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$state" "$driver"
          git commit -m "ci(stfeols): retry after sanitized completion failure"
          git pull --rebase origin main
          git push origin HEAD:main
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
