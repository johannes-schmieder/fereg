name: Apply bundled reference probe path

on:
  push:
    branches:
      - codex/categorical-interactions
    paths:
      - .github/workflows/apply-bundled-reference-probe.yml
      - ci/source-transforms/activate_bundled_reference_probe.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stfixest-apply-bundled-reference-probe-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 30
    steps:
      - name: Check out exact activation checkpoint
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply and push bundled probe activation
        id: activate
        continue-on-error: true
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          transform="ci/source-transforms/activate_bundled_reference_probe.py"
          workflow=".github/workflows/fe-interaction-reference-probe.yml"
          contract="tests/python/test_bundled_reference_root_contract.py"

          /usr/bin/python3 -m py_compile "$transform"
          /usr/bin/python3 "$transform"
          /usr/bin/python3 -m unittest discover \
            -s tests/python \
            -p 'test_bundled_reference_root_contract.py'

          rm "$transform"
          rmdir ci/source-transforms 2>/dev/null || true
          rm .github/workflows/apply-bundled-reference-probe.yml

          /usr/bin/python3 - <<'PY'
          import subprocess

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "--"], text=True
              ).splitlines()
          )
          expected = {
              ".github/workflows/apply-bundled-reference-probe.yml",
              ".github/workflows/fe-interaction-reference-probe.yml",
              "ci/source-transforms/activate_bundled_reference_probe.py",
          }
          if changed != expected:
              raise SystemExit(
                  "bundled probe activation changed unexpected files: "
                  + ", ".join(sorted(changed ^ expected))
              )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci(reference): activate offline bundled probe path"

          for attempt in 1 2 3; do
            git fetch origin "refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}"
            git rebase "refs/remotes/origin/${BRANCH_NAME}"
            if git push origin "HEAD:refs/heads/${BRANCH_NAME}"; then
              exit 0
            fi
          done
          echo "bundled reference activation lost three branch update races" >&2
          exit 1

      - name: Publish exact staging-SHA failure receipt
        if: steps.activate.outcome == 'failure'
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/bundled-reference-activation-failure.json"
          RECEIPT="$receipt" /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": 1,
              "status": "failure",
              "failure_kind": "bundled_reference_activation_failure",
              "staging_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "branch": os.environ["GITHUB_REF_NAME"],
          }
          Path(os.environ["RECEIPT"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          result_path=".ci/source-transform/results/$GITHUB_SHA-bundled-reference-activation.json"
          publish="$RUNNER_TEMP/bundled-reference-activation-publish"
          git fetch origin "$BRANCH_NAME"
          git worktree add --detach "$publish" "origin/$BRANCH_NAME"
          mkdir -p "$publish/$(dirname "$result_path")"
          cp "$receipt" "$publish/$result_path"
          git -C "$publish" config user.name "github-actions[bot]"
          git -C "$publish" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish" add "$result_path"
          git -C "$publish" commit -m "ci(source-transform): record ${GITHUB_SHA:0:12} bundled-reference failure [skip ci]"
          git -C "$publish" push origin "HEAD:refs/heads/$BRANCH_NAME"
          git worktree remove --force "$publish"

      - name: Enforce activation success
        if: steps.activate.outcome == 'failure'
        run: exit 1
