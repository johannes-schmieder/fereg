name: Format categorical iid oracle

on:
  push:
    branches:
      - codex/stfixest-interactions
    paths:
      - .github/workflows/format-categorical-iid-oracle.yml

permissions:
  contents: write

concurrency:
  group: stfixest-source-transform-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 15
    steps:
      - name: Check out formatting checkpoint
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Format and push oracle source
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          toolchain_root="$(/opt/homebrew/bin/rustup run 1.85.1 rustc --print sysroot)"
          export PATH="$toolchain_root/bin:/opt/homebrew/bin:$PATH"
          cargo fmt --all
          rm .github/workflows/format-categorical-iid-oracle.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "formatter produced no changes" >&2; exit 1; }
          git commit -m "style: format categorical iid oracle"
          git fetch origin "refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}"
          git rebase "refs/remotes/origin/${BRANCH_NAME}"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
