name: Temporary Rust remote smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - 'rust-smoke/**'

jobs:
  rust-smoke:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Test
        run: cargo test --manifest-path rust-smoke/Cargo.toml --verbose

      - name: Build release
        run: cargo build --manifest-path rust-smoke/Cargo.toml --release --verbose

      - name: Run executable
        run: cargo run --manifest-path rust-smoke/Cargo.toml --release
