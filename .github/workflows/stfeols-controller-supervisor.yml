name: Supervise guarded stfeols controller

on:
  workflow_run:
    workflows:
      - Run corrected bootstrapped stfeols completion
    types:
      - completed
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prune obsolete queue and ensure one bounded controller is active
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request

          api = os.environ['API_URL']
          repo = os.environ['REPOSITORY']
          current = int(os.environ['CURRENT_RUN_ID'])
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'stfixest-guarded-controller-supervisor',
          }

          def call(url, method='GET', body=None, ignored=(409, 422)):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(
                  url, data=data, headers=headers, method=method
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      payload = response.read()
              except urllib.error.HTTPError as error:
                  if error.code in ignored:
                      return {'ignored_http_status': error.code}
                  raise
              return json.loads(payload) if payload else {}

          def repository_json(path):
              response = call(
                  f'{api}/repos/{repo}/contents/{path}?ref=main', ignored=(404,)
              )
              if response.get('ignored_http_status') == 404:
                  return None
              content = base64.b64decode(response['content']).decode()
              return json.loads(content)

          completion = repository_json('.ci/dev/stfeols-complete.json') or {}
          completion_fields = {
              'schema_version': 1,
              'public_activation': True,
              'full_scientific_qualification': 'success',
              'licensed_stata': 'success',
              'rust_source': 'success',
              'frozen_projection': 'success',
              'benchmark_gate': 'success',
              'public_transaction': 'success',
              'performance': 'accepted',
          }
          if all(completion.get(k) == v for k, v in completion_fields.items()):
              print('Completion marker is present; the bounded controller will perform exact-SHA validation.')

          watchdog = repository_json('.ci/dev/stfeols-watchdog.json') or {}
          if int(watchdog.get('attempts', 0)) > 24:
              raise SystemExit('watchdog attempt cap is already exceeded')
          if int(watchdog.get('codex_failures', 0)) > 3:
              raise SystemExit('watchdog Codex-failure cap is already exceeded')

          protected = {
              'Run corrected bootstrapped stfeols completion',
              'Supervise guarded stfeols controller',
          }
          all_runs = []
          for status in ('queued', 'in_progress'):
              all_runs.extend(
                  call(
                      f'{api}/repos/{repo}/actions/runs?status={status}&branch=main&per_page=100'
                  ).get('workflow_runs', [])
              )

          active_controller = False
          cancelled = []
          for run in all_runs:
              name = run.get('name')
              if run['id'] == current:
                  continue
              if name == 'Run corrected bootstrapped stfeols completion':
                  active_controller = True
                  continue
              if name == 'Supervise guarded stfeols controller':
                  continue
              # The controller performs its own exact-source quick qualification.
              # Obsolete normal/development runs would only delay the single licensed runner.
              call(
                  f"{api}/repos/{repo}/actions/runs/{run['id']}/cancel",
                  method='POST',
              )
              cancelled.append(
                  {
                      'id': run['id'],
                      'name': name,
                      'status': run.get('status'),
                      'sha': run.get('head_sha'),
                  }
              )

          if not active_controller:
              call(
                  f'{api}/repos/{repo}/actions/workflows/'
                  'stfeols-autonomous-completion-v4.yml/dispatches',
                  method='POST',
                  body={'ref': 'main', 'inputs': {'phases': '6'}},
              )
          print(
              json.dumps(
                  {
                      'active_controller_before_dispatch': active_controller,
                      'cancelled': cancelled,
                      'completion_marker_present': bool(completion),
                      'watchdog_attempts': watchdog.get('attempts', 0),
                  },
                  indent=2,
              )
          )
          PY
