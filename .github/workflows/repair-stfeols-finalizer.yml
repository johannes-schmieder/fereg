name: Repair stfeols completion finalizer

on:
  push:
    branches: [main]
    paths: [".github/workflows/repair-stfeols-finalizer.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Allow only evidence-only descendants of the fully tested source
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/finalize-stfeols-completion.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          if receipt.get('tested_sha') != __import__('subprocess').check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip():
              raise SystemExit('full completion receipt is not bound to clean main HEAD')
'''
          new = '''          import subprocess

          tested_sha = receipt.get('tested_sha')
          if not isinstance(tested_sha, str) or not re.fullmatch(r'[0-9a-f]{40}', tested_sha):
              raise SystemExit('full completion receipt has no exact tested source SHA')
          subprocess.run(['git', 'merge-base', '--is-ancestor', tested_sha, 'HEAD'], check=True)
          allowed = (
              ':(exclude).ci/stata/results/**',
              ':(exclude).ci/stata/latest.json',
              ':(exclude)STATUS.md',
          )
          command = ['git', 'diff', '--quiet', f'{tested_sha}..HEAD', '--', '.', *allowed]
          if subprocess.run(command).returncode != 0:
              raise SystemExit('main contains source drift after the fully tested source SHA')
'''
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('finalizer receipt-binding anchor is not unique')
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/repair-stfeols-finalizer.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci(stfeols): accept evidence-only receipt descendants [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
