name: Fix categorical Stata absorb shape gate

on:
  push:
    branches:
      - codex/categorical-interactions
    paths:
      - .github/workflows/fix-categorical-stata-shape-gate.yml

permissions:
  contents: write

concurrency:
  group: stfixest-fix-categorical-stata-shape-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 15
    steps:
      - name: Check out shape-gate checkpoint
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Patch helper and source contract
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          helper = Path("stata/_stfixest_estimate_ols_test.ado")
          contract = Path("tests/python/test_categorical_hidden_transport_contract.py")
          replace_once(
              helper,
              "            if `absorb_terms'[`row',2] != 1 | `absorb_terms'[`row',3] < 1 | ///\n",
              "            if `absorb_terms'[`row',2] < 1 | `absorb_terms'[`row',3] != 1 | ///\n",
              "categorical absorbed-term shape gate",
          )
          replace_once(
              contract,
              '        self.assertIn("`absorb_terms\'[`row\',3] < 1", stata)\n',
              '        self.assertIn("`absorb_terms\'[`row\',2] < 1", stata)\n'
              '        self.assertIn("`absorb_terms\'[`row\',3] != 1", stata)\n',
              "categorical absorbed-term shape contract",
          )
          PY

          /usr/bin/python3 -m py_compile tests/python/test_categorical_hidden_transport_contract.py
          rm .github/workflows/fix-categorical-stata-shape-gate.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "shape-gate repair produced no changes" >&2; exit 1; }
          git commit -m "stata: fix categorical absorb shape gate"
          git fetch origin "refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}"
          git rebase "refs/remotes/origin/${BRANCH_NAME}"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
