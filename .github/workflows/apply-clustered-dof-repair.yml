name: Apply clustered DoF repair

on:
  push:
    branches:
      - codex/stfixest-interactions
    paths:
      - .github/workflows/apply-clustered-dof-repair.yml
      - ci/source-transforms/generalize_prepared_iid.py

permissions:
  contents: write

concurrency:
  group: stfixest-source-transform-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 20
    steps:
      - name: Check out repair commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply, format, and push repaired source
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          transform="ci/source-transforms/generalize_prepared_iid.py"
          test -f "$transform"

          /usr/bin/python3 "$transform"
          toolchain_root="$(/opt/homebrew/bin/rustup run 1.85.1 rustc --print sysroot)"
          export PATH="$toolchain_root/bin:/opt/homebrew/bin:$PATH"
          cargo fmt --all

          rm "$transform"
          rmdir ci/source-transforms 2>/dev/null || true
          rm .github/workflows/apply-clustered-dof-repair.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "clustered DoF repair produced no changes" >&2; exit 1; }
          git commit -m "ols: restore cluster-aware DoF composition"
          git fetch origin "refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}"
          git rebase "refs/remotes/origin/${BRANCH_NAME}"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
