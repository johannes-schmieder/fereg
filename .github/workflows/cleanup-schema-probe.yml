name: Clean accidental connector schema probe

on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-schema-probe.yml"]

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Close exact probe issue if it exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue list --state open --search '"DO NOT CREATE" in:title' --json number,title \
            --jq '.[] | select(.title == "DO NOT CREATE") | .number' | \
          while read -r number; do
            test -n "$number" || continue
            gh issue close "$number" --comment "Closed: accidental connector schema probe; no project decision or work item."
          done
      - name: Remove cleanup workflow
        run: |
          set -euo pipefail
          rm .github/workflows/cleanup-schema-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: remove schema-probe cleanup [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
