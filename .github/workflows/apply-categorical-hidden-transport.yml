name: Apply categorical hidden OLS transport

on:
  push:
    branches:
      - codex/categorical-interactions
    paths:
      - .github/workflows/apply-categorical-hidden-transport.yml
      - ci/source-transforms/activate_categorical_hidden_transport.py

permissions:
  contents: write

concurrency:
  group: stfixest-categorical-hidden-transport-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 30
    steps:
      - name: Check out transport checkpoint
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply, format, and push categorical hidden transport
        id: apply_transform
        continue-on-error: true
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          transform="ci/source-transforms/activate_categorical_hidden_transport.py"
          /usr/bin/python3 -m py_compile "$transform"
          /usr/bin/python3 "$transform"

          toolchain_root="$(/opt/homebrew/bin/rustup run 1.85.1 rustc --print sysroot)"
          export PATH="$toolchain_root/bin:/opt/homebrew/bin:$PATH"
          cargo fmt --all

          rm "$transform"
          rmdir ci/source-transforms 2>/dev/null || true
          rm .github/workflows/apply-categorical-hidden-transport.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "categorical hidden transport produced no changes" >&2; exit 1; }
          git commit -m "plugin: add categorical hidden OLS transport"
          git fetch origin "refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}"
          git rebase "refs/remotes/origin/${BRANCH_NAME}"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"

      - name: Publish transform failure marker
        if: steps.apply_transform.outcome == 'failure'
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/categorical-hidden-transport-failure.json"
          /usr/bin/python3 - <<'PY' > "$payload"
          import json
          import os
          print(json.dumps({
              "schema": 1,
              "status": "failure",
              "staging_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "branch": os.environ["GITHUB_REF_NAME"],
          }, indent=2, sort_keys=True))
          PY
          git fetch origin "$BRANCH_NAME"
          publish="$RUNNER_TEMP/categorical-hidden-transport-publish"
          git worktree add --detach "$publish" "origin/$BRANCH_NAME"
          mkdir -p "$publish/.ci/source-transform/results"
          cp "$payload" "$publish/.ci/source-transform/results/$GITHUB_SHA.json"
          git -C "$publish" config user.name "github-actions[bot]"
          git -C "$publish" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish" add ".ci/source-transform/results/$GITHUB_SHA.json"
          git -C "$publish" commit -m "ci(source-transform): record ${GITHUB_SHA:0:12} hidden-transport failure [skip ci]"
          git -C "$publish" push origin "HEAD:refs/heads/$BRANCH_NAME"
          git worktree remove --force "$publish"

      - name: Enforce transform success
        if: steps.apply_transform.outcome == 'failure'
        run: exit 1
