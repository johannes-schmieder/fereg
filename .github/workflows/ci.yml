name: Incremental refactoring checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: incremental-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      FEREG_TEST_PROFILE: ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - name: Activate the repository toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Rust and mock-SPI checks
        run: ./scripts/run_tests.sh

  comparator:
    # Draft listings require push access. This job runs no repository code;
    # the numerical build/replay job receives only the downloaded artifact.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the frozen draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download legacy-comparator-v1
          --repo johannes-schmieder/fereg --dir comparator
          --pattern fereg_legacy_linux.plugin
          --pattern fereg_legacy_linux.plugin.json
          --pattern fereg_legacy_linux.plugin.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-linux-comparator
          path: comparator/
          if-no-files-found: error

  replay:
    needs: comparator
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Activate the repository toolchain
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.85.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: replay-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: canonical-linux-comparator
          path: native-artifacts/comparator
      - name: Verify the canonical comparator (never rebuild)
        run: python3 scripts/legacy_comparator.py verify --platform linux --directory native-artifacts/comparator
      - name: Build next and replay complete OLS and PPML transactions
        run: |
          ./scripts/build_linux.sh
          ./scripts/run_plugin_replay.sh dist/fereg_linux.plugin native-artifacts/comparator/fereg_legacy_linux.plugin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: actual-plugin-replay
          path: target/replay/results/
          if-no-files-found: error
