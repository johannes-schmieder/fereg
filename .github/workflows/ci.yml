name: Tests

on:
  # Remote testing remains paused by the owner; manual only until resumed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incremental-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      FEREG_TEST_PROFILE: ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - name: Activate the repository toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Executable benchmark contract checks
        run: |
          python3.12 -m venv target/bench-ci-env
          target/bench-ci-env/bin/pip install numpy==1.26.4 pandas==2.2.2
          target/bench-ci-env/bin/python -m unittest discover -s bench/tests
      - name: Rust and mock-SPI checks
        run: ./scripts/run_tests.sh

  replay:
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Activate the repository toolchain
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.85.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: replay-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
      - name: Build and replay complete OLS and PPML transactions
        run: |
          ./scripts/build_linux.sh
          ./scripts/run_plugin_replay.sh dist/fereg_linux.plugin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: actual-plugin-replay
          path: target/replay/results/
          if-no-files-found: error
