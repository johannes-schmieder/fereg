name: Qualify full stfeols development baseline

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stfeols-full-baseline.yml"
      - "scripts/development/qualify_stfeols_full_baseline.py"
  workflow_dispatch:

concurrency:
  group: stfixest-mac-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp

jobs:
  full-baseline:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Wait for exact-green interaction advancement and qualify full profile
        shell: bash
        run: |
          cd scripts/development
          /usr/bin/python3 qualify_stfeols_full_baseline.py
