name: Rust smoke test

on:
  pull_request:
    branches:
      - ci/rust-smoke-base

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Run unit tests
        run: cargo test --manifest-path rust-smoke/Cargo.toml --verbose

      - name: Build release executable
        run: cargo build --manifest-path rust-smoke/Cargo.toml --release --verbose

      - name: Run release executable
        run: cargo run --manifest-path rust-smoke/Cargo.toml --release
