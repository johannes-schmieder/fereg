name: Dispatch option A source correction once

on:
  push:
    branches: [main]
    paths: [".github/workflows/dispatch-option-a-source-correction.yml"]
  issues:
    types: [opened]
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: stfixest-option-a-dispatch-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  dispatch:
    if: >-
      github.repository == 'johannes-schmieder/StFixest' &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       github.event.issue.title == 'INTERNAL: dispatch option A source correction')
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Atomically mark, remove this dispatcher, and launch the bounded gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          marker=.ci/dev/option-a-source-correction-dispatched.json
          if [[ -f "$marker" ]]; then
            echo "Option A source correction was already dispatched."
            gh issue close 14 --repo "$REPOSITORY" --reason completed || true
            exit 0
          fi

          status_complete=false
          if grep -q 'signed-DoF publication was removed' STATUS.md \
             && grep -q 'ols_intercept_slope_positive_dof' benchmarks/manifests/ols_v1.json \
             && ! grep -R -q 'fit_prepared_categorical_ols_signed_unadjusted_map' \
                    crates/stfixest-core crates/stfixest-plugin crates/stfixest-testkit; then
            status_complete=true
          fi

          mkdir -p .ci/dev
          STATUS_COMPLETE="$status_complete" /usr/bin/python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          head = subprocess.check_output(
              ('git', 'rev-parse', 'HEAD'), text=True
          ).strip()
          already_complete = os.environ['STATUS_COMPLETE'] == 'true'
          Path('.ci/dev/option-a-source-correction-dispatched.json').write_text(
              json.dumps(
                  {
                      'schema_version': 1,
                      'recorded_at': datetime.now(timezone.utc).isoformat(),
                      'source_head': head,
                      'policy': 'option_a_positive_residual_dof',
                      'workflow': 'codex-next-stfeols-gate.yml',
                      'dispatch_required': not already_complete,
                      'already_complete': already_complete,
                  },
                  indent=2,
              ) + '\n',
              encoding='utf-8',
          )
          PY
          rm -f .github/workflows/dispatch-option-a-source-correction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/dev/option-a-source-correction-dispatched.json \
                  .github/workflows/dispatch-option-a-source-correction.yml
          git commit -m "ci(dev): record option A source dispatch [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then
              exit 1
            fi
            sleep $((2 * attempt))
          done

          if [[ "$status_complete" != true ]]; then
            gh api \
              --method POST \
              "repos/${REPOSITORY}/actions/workflows/codex-next-stfeols-gate.yml/dispatches" \
              -f ref=main
          else
            echo "Option A is already complete; no duplicate coding run dispatched."
          fi
          gh issue close 14 --repo "$REPOSITORY" --reason completed || true
