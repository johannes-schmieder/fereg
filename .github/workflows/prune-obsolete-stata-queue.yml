name: Prune obsolete queued Stata runs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prune-obsolete-stata-queue.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only queued obsolete normal-CI runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          api = os.environ["API_URL"]
          repo = os.environ["REPOSITORY"]
          current = os.environ["CURRENT_SHA"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "stfixest-obsolete-queue-pruner",
          }

          def request(url: str, method: str = "GET") -> dict:
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  payload = response.read()
              return json.loads(payload) if payload else {}

          url = (
              f"{api}/repos/{repo}/actions/workflows/stata-ci.yml/runs"
              "?status=queued&branch=main&per_page=100"
          )
          runs = request(url).get("workflow_runs", [])
          cancelled = []
          for run in runs:
              if run.get("head_sha") == current:
                  continue
              request(
                  f"{api}/repos/{repo}/actions/runs/{run['id']}/cancel",
                  method="POST",
              )
              cancelled.append({"run_id": run["id"], "head_sha": run.get("head_sha")})
          print(json.dumps({"current_sha": current, "cancelled": cancelled}, indent=2))
          PY
