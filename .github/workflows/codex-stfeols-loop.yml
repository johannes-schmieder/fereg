name: Run guarded stfeols completion loop

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/codex-stfeols-loop.yml"
      - "scripts/development/run_codex_stfeols_loop.sh"
      - ".ci/dev/codex-runner-probe.json"
  workflow_dispatch:
    inputs:
      phases:
        description: Maximum bounded coding phases
        required: true
        default: "8"

concurrency:
  group: stfixest-mac-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
  STFIXEST_CODEX_PHASES: ${{ inputs.phases || '8' }}

jobs:
  continue:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Run bounded exact-green phases
        shell: bash
        run: bash scripts/development/run_codex_stfeols_loop.sh
