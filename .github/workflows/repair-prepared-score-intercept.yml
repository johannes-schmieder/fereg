name: Repair absorbed-intercept score certificate

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-prepared-score-intercept.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 30
    steps:
      - name: Check out trigger commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Repair certificate scale and add regression guard
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/stfixest-core/src/ols/prepared_fit.rs")
          text = path.read_text(encoding="utf-8")

          old = '''        // A coordinate certified as lying in the absorbed span has no finite
          // score equation: its normal equation is already covered by the
          // independent FE certificate. Do not divide its MAP-noise within norm
          // into a manufactured order-one moment. Deferred/normalized constants
          // and finite rank-deficient coordinates remain explicitly checked.
          if status == PreparedOlsFitStatus::CollinearWithFixedEffects {
              continue;
          }
          let denominator = if score_norm > 0.0 {
              score_norm
          } else {
              reference_norm
          };
          '''
          new = '''        // A coordinate certified as lying in the absorbed span has no finite
          // score equation: its normal equation is already covered by the
          // independent FE certificate. Do not divide its MAP-noise within norm
          // into a manufactured order-one moment. A normalized absorbed intercept
          // still keeps its raw score moment, but that moment must use the raw
          // intercept norm rather than a numerically nonzero MAP-noise norm.
          // Finite rank-deficient coordinates remain explicitly checked on their
          // within scale.
          if status == PreparedOlsFitStatus::CollinearWithFixedEffects {
              continue;
          }
          let denominator = if status == PreparedOlsFitStatus::NormalizedAbsorbedIntercept {
              reference_norm
          } else if score_norm > 0.0 {
              score_norm
          } else {
              reference_norm
          };
          '''
          if text.count(old) != 1:
              raise SystemExit("score denominator source anchor is not unique")
          text = text.replace(old, new)

          anchor = '''        assert_close(
              control.coefficients()[0]
                  .value
                  .expect("normalized intercept"),
              weighted_mean_slice(&y, normalized_weights(&prepared).expect("weights")).expect("mean"),
              1e-10,
          );

          let mut reservation = InjectedReservation::default();
          '''
          replacement = '''        assert_close(
              control.coefficients()[0]
                  .value
                  .expect("normalized intercept"),
              weighted_mean_slice(&y, normalized_weights(&prepared).expect("weights")).expect("mean"),
              1e-10,
          );

          // A structurally absorbed intercept can acquire a tiny nonzero within
          // norm from iterative MAP roundoff. Its score remains a raw intercept
          // moment; scaling by that noise norm would manufacture an order-one
          // failure. Keep the existing fail-closed perturbation check below.
          let weights = normalized_weights(&prepared).expect("weights");
          let rhs = prepared.fit_build_rhs().expect("rhs");
          let reference_norm =
              weighted_matrix_column_norm(&rhs, 1, weights).expect("reference intercept norm");
          let mut roundoff_residuals = control.residuals().to_vec();
          for residual in &mut roundoff_residuals {
              *residual += 1e-14;
          }
          let roundoff = certify_scores(
              &prepared,
              &roundoff_residuals,
              weights,
              &[reference_norm],
              &[reference_norm * 1e-14],
              &[PreparedOlsFitStatus::NormalizedAbsorbedIntercept],
              1.0,
              PreparedOlsFitConfig::default().score_tolerance,
          )
          .expect("roundoff score certificate");
          assert!(roundoff.passed);
          assert!(roundoff.relative_infinity_norm < 1e-12);

          let mut reservation = InjectedReservation::default();
          '''
          if text.count(anchor) != 1:
              raise SystemExit("score regression-test anchor is not unique")
          text = text.replace(anchor, replacement)
          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/repair-prepared-score-intercept.yml
          cargo fmt --all -- --check

      - name: Commit repair directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/stfixest-core/src/ols/prepared_fit.rs .github/workflows/repair-prepared-score-intercept.yml
          git commit -m "core: stabilize absorbed-intercept score certificate"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
