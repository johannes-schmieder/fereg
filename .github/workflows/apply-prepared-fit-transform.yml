name: Apply prepared fit-view refactor

on:
  push:
    branches:
      - codex/stfixest-interactions
    paths:
      - ci/source-transforms/generalize_prepared_fit.py
      - ci/source-transforms/trigger.txt

permissions:
  contents: write

concurrency:
  group: stfixest-source-transform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    steps:
      - name: Check out transform commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact source transformation
        id: transform
        run: |
          mkdir -p .ci
          set +e
          /usr/bin/python3 ci/source-transforms/generalize_prepared_fit.py > .ci/source-transform.log 2>&1
          rc=$?
          set -e
          cat .ci/source-transform.log
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: Record transformation failure
        if: steps.transform.outputs.rc != '0'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/source-transform.log
          git commit -m "build: record failed prepared fit-view transform"
          git fetch origin "${BRANCH_NAME}"
          git rebase "origin/${BRANCH_NAME}"
          git push origin "HEAD:${BRANCH_NAME}"
          exit 1

      - name: Format transformed Rust source
        if: steps.transform.outputs.rc == '0'
        run: cargo fmt --all

      - name: Remove one-time transformation machinery
        if: steps.transform.outputs.rc == '0'
        run: |
          rm ci/source-transforms/generalize_prepared_fit.py
          rm -f ci/source-transforms/trigger.txt
          rmdir ci/source-transforms 2>/dev/null || true
          rm .github/workflows/apply-prepared-fit-transform.yml
          rm -f .ci/source-transform.log

      - name: Commit transformed source
        if: steps.transform.outputs.rc == '0'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "transformation produced no changes"; exit 1; }
          git commit -m "ols: generalize certified fit over categorical view"
          git fetch origin "${BRANCH_NAME}"
          git rebase "origin/${BRANCH_NAME}"
          git push origin "HEAD:${BRANCH_NAME}"
