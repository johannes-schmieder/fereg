name: Preempt obsolete Mac development runs
# option-a-preemption: 2026-08-24T12:40:00Z

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/preempt-obsolete-stfeols-runs.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  preempt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel stale completion runs and prioritize option A
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          API_URL: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          api = os.environ['API_URL']
          repo = os.environ['REPOSITORY']
          current = int(os.environ['CURRENT_RUN_ID'])
          cutoff = '2026-08-24T12:14:00Z'
          codex_name = 'Run one bounded coding-agent stfeols gate'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'stfixest-option-a-preemptor',
          }

          def call(url, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(
                  url, data=data, headers=headers, method=method
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      payload = response.read()
              except urllib.error.HTTPError as error:
                  if error.code in (409, 422):
                      return {'ignored_http_status': error.code}
                  raise
              return json.loads(payload) if payload else {}

          runs = []
          for status in ('in_progress', 'queued'):
              for run in call(
                  f'{api}/repos/{repo}/actions/runs?status={status}&branch=main&per_page=100'
              ).get('workflow_runs', []):
                  run = dict(run)
                  run['listed_status'] = status
                  runs.append(run)

          eligible = [
              run for run in runs
              if run.get('name') == codex_name
              and run.get('created_at', '') >= cutoff
          ]
          running = sorted(
              (run for run in eligible if run['listed_status'] == 'in_progress'),
              key=lambda run: run.get('created_at', ''),
          )
          queued = sorted(
              (run for run in eligible if run['listed_status'] == 'queued'),
              key=lambda run: run.get('created_at', ''),
          )
          keep = running[:1] if running else queued[:1]
          keep_ids = {run['id'] for run in keep}

          protected_names = {
              'Preempt obsolete Mac development runs',
              'Reconcile STATUS with option A absorbed-slope decision',
          }
          cancelled = []
          for run in runs:
              if run['id'] == current or run['id'] in keep_ids:
                  continue
              if run.get('name') in protected_names:
                  continue
              call(
                  f"{api}/repos/{repo}/actions/runs/{run['id']}/cancel",
                  method='POST',
              )
              cancelled.append(
                  {
                      'id': run['id'],
                      'name': run.get('name'),
                      'sha': run.get('head_sha'),
                      'created_at': run.get('created_at'),
                      'prior_status': run['listed_status'],
                  }
              )

          dispatched = False
          if not keep:
              time.sleep(2)
              call(
                  f'{api}/repos/{repo}/actions/workflows/'
                  'codex-next-stfeols-gate.yml/dispatches',
                  method='POST',
                  body={'ref': 'main'},
              )
              dispatched = True

          print(
              json.dumps(
                  {
                      'kept_option_a_run': [
                          {
                              'id': run['id'],
                              'sha': run.get('head_sha'),
                              'created_at': run.get('created_at'),
                              'status': run['listed_status'],
                          }
                          for run in keep
                      ],
                      'cancelled': cancelled,
                      'dispatched': dispatched,
                  },
                  indent=2,
              )
          )
          PY
