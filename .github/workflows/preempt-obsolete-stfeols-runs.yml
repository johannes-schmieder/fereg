name: Preempt obsolete Mac development runs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/preempt-obsolete-stfeols-runs.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  preempt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel only obsolete in-progress Mac workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          API_URL: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api = os.environ['API_URL']
          repo = os.environ['REPOSITORY']
          current = int(os.environ['CURRENT_RUN_ID'])
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'stfixest-obsolete-run-preemptor',
          }

          def call(url, method='GET'):
              request = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request) as response:
                      payload = response.read()
              except urllib.error.HTTPError as error:
                  if error.code in (409, 422):
                      return {}
                  raise
              return json.loads(payload) if payload else {}

          protected = {
              'Run corrected bootstrapped stfeols completion',
              'Guard stfeols completion continuation',
              'Prioritize corrected stfeols completion',
              'Preempt obsolete Mac development runs',
          }
          runs = call(
              f'{api}/repos/{repo}/actions/runs?status=in_progress&branch=main&per_page=100'
          ).get('workflow_runs', [])
          cancelled = []
          for run in runs:
              if run['id'] == current or run.get('name') in protected:
                  continue
              call(
                  f"{api}/repos/{repo}/actions/runs/{run['id']}/cancel",
                  method='POST',
              )
              cancelled.append(
                  {'id': run['id'], 'name': run.get('name'), 'sha': run.get('head_sha')}
              )
          print(json.dumps({'cancelled': cancelled}, indent=2))
          PY
