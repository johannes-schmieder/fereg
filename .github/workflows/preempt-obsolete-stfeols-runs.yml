name: Preempt obsolete Mac development runs
# option-a-preemption: 2026-08-24

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/preempt-obsolete-stfeols-runs.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  preempt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel stale completion runs and preserve option-A correction
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          API_URL: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          api = os.environ['API_URL']
          repo = os.environ['REPOSITORY']
          current = int(os.environ['CURRENT_RUN_ID'])
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'stfixest-option-a-preemptor',
          }

          def call(url, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(
                  url, data=data, headers=headers, method=method
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      payload = response.read()
              except urllib.error.HTTPError as error:
                  if error.code in (409, 422):
                      return {'ignored_http_status': error.code}
                  raise
              return json.loads(payload) if payload else {}

          protected = {
              'Run one bounded coding-agent stfeols gate',
              'Preempt obsolete Mac development runs',
          }
          cancelled = []
          for status in ('in_progress', 'queued'):
              runs = call(
                  f'{api}/repos/{repo}/actions/runs?status={status}&branch=main&per_page=100'
              ).get('workflow_runs', [])
              for run in runs:
                  if run['id'] == current or run.get('name') in protected:
                      continue
                  call(
                      f"{api}/repos/{repo}/actions/runs/{run['id']}/cancel",
                      method='POST',
                  )
                  cancelled.append(
                      {
                          'id': run['id'],
                          'name': run.get('name'),
                          'sha': run.get('head_sha'),
                          'prior_status': status,
                      }
                  )
          time.sleep(2)
          dispatch = call(
              f'{api}/repos/{repo}/actions/workflows/'
              'codex-next-stfeols-gate.yml/dispatches',
              method='POST',
              body={'ref': 'main'},
          )
          print(json.dumps({'cancelled': cancelled, 'dispatch': dispatch}, indent=2))
          PY
