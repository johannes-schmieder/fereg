name: Apply prepared iid-view refactor

on:
  push:
    branches:
      - codex/stfixest-interactions
    paths:
      - ci/source-transforms/generalize_prepared_iid.py
      - ci/source-transforms/trigger-iid.txt

permissions:
  contents: write

concurrency:
  group: stfixest-iid-source-transform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    steps:
      - name: Check out transform commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact source transformation
        run: /usr/bin/python3 ci/source-transforms/generalize_prepared_iid.py

      - name: Format transformed Rust source
        run: cargo fmt --all

      - name: Remove one-time transformation machinery
        run: |
          rm ci/source-transforms/generalize_prepared_iid.py
          rm -f ci/source-transforms/trigger-iid.txt
          rmdir ci/source-transforms 2>/dev/null || true
          rm .github/workflows/apply-prepared-iid-transform.yml

      - name: Commit transformed source
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "transformation produced no changes"; exit 1; }
          git commit -m "ols: generalize certified iid inference over categorical view"
          git fetch origin "refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}"
          git rebase "refs/remotes/origin/${BRANCH_NAME}"
          git push origin "HEAD:${BRANCH_NAME}"
