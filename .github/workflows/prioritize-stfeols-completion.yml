name: Prioritize exact-green stfeols completion

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prioritize-stfeols-completion.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  prioritize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel obsolete queued runs and dispatch the completion orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          API_URL: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          api = os.environ["API_URL"]
          repo = os.environ["REPOSITORY"]
          current_run = int(os.environ["CURRENT_RUN_ID"])
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "stfixest-completion-prioritizer",
          }

          def call(url: str, method: str = "GET", body: dict | None = None) -> dict:
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(
                  url, data=data, headers=headers, method=method
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      payload = response.read()
              except urllib.error.HTTPError as error:
                  if error.code in (409, 422):
                      return {"ignored_http_status": error.code}
                  raise
              return json.loads(payload) if payload else {}

          queued = call(
              f"{api}/repos/{repo}/actions/runs?status=queued&branch=main&per_page=100"
          ).get("workflow_runs", [])
          cancelled = []
          protected_names = {
              "Prioritize exact-green stfeols completion",
              "Run exact-green stfeols completion orchestrator",
          }
          for run in queued:
              if run["id"] == current_run or run.get("name") in protected_names:
                  continue
              call(
                  f"{api}/repos/{repo}/actions/runs/{run['id']}/cancel",
                  method="POST",
              )
              cancelled.append(
                  {
                      "id": run["id"],
                      "name": run.get("name"),
                      "head_sha": run.get("head_sha"),
                  }
              )

          # Give cancellation requests a brief chance to release the single Mac runner.
          time.sleep(2)
          dispatch = call(
              f"{api}/repos/{repo}/actions/workflows/"
              "stfeols-autonomous-completion.yml/dispatches",
              method="POST",
              body={"ref": "main", "inputs": {"phases": "24"}},
          )
          print(json.dumps({"cancelled": cancelled, "dispatch": dispatch}, indent=2))
          PY
