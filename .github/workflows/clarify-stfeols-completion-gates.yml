name: Clarify stfeols candidate and final gates

on:
  push:
    branches: [main]
    paths: [".github/workflows/clarify-stfeols-completion-gates.yml"]

permissions:
  contents: write

jobs:
  clarify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Patch the agent contract without retriggering the licensed driver
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/stfeols_completion_prompt.md')
          text = path.read_text(encoding='utf-8')
          anchor = '''8. Never claim completion based only on unit tests. Completion must be encoded in a strict
   machine-verifiable `ci/check_stfeols_completion.py` gate that independently checks the
   public command, full frozen projection, exact-green licensed-Stata/Rust receipt, release
   fail-closed boundaries for PPML, and the registered performance/RSS evidence.
'''
          replacement = '''8. Never claim completion based only on unit tests. Completion must be encoded in a strict
   machine-verifiable `ci/check_stfeols_completion.py` gate with two explicit modes:
   - with no `--receipt`, it is the candidate gate and must check the enabled public command,
     40/40 frozen projection, independent oracles, rollback/Break and binary/identity gates,
     an exact-green quick licensed-Stata/Rust receipt for the current candidate, the registered
     performance/RSS evidence, and fail-closed PPML boundaries;
   - with `--receipt PATH`, it is the final gate and must additionally require a successful
     full-profile licensed-Stata/Rust receipt bound to that candidate source, allowing only
     subsequent evidence/status commits.
   The final full run necessarily occurs only after the candidate gate is green; do not create
   a circular requirement that makes the no-argument candidate gate demand its future full
   receipt.
'''
          if anchor in text:
              text = text.replace(anchor, replacement)
          elif replacement not in text:
              raise SystemExit('completion-gate contract anchor is not unique')
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/clarify-stfeols-completion-gates.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(stfeols): distinguish candidate and final gates [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
