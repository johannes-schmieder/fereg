name: Bootstrap recovered source

on:
  push:
    branches:
      - codex/full-implementation
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-snapshot.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/full-implementation
          fetch-depth: 0

      - name: Expand recovered Phase 0-1 source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/phase01.part* | base64 --decode > /tmp/phase01.tar.xz
          rm -rf /tmp/phase01
          mkdir -p /tmp/phase01
          tar -xJf /tmp/phase01.tar.xz -C /tmp/phase01
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.bootstrap' \
            --exclude='.github/workflows/**' \
            /tmp/phase01/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-snapshot.yml

      - name: Commit recovered foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'feat: recover Phase 0-1 architecture foundation'
            git push origin HEAD:codex/full-implementation
          fi
