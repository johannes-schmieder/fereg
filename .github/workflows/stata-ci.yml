name: Licensed Stata and Rust CI

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Mac Stata/Rust test profile
        required: true
        type: choice
        options:
          - version
          - smoke
          - syntax
          - quick
          - mata-unit
          - plugin-build
          - plugin-load
          - numerical-small
          - differential
          - benchmark-small
          - full
        default: smoke
  push:
    branches:
      - main
    paths-ignore:
      - ".ci/stata/latest.json"
      - ".ci/stata/results/**"

concurrency:
  group: stfixest-mac-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  mac-ci:
    name: Mac Rust quick + Stata / ${{ inputs.profile || 'quick' }}
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      STATA_BIN: /Applications/Stata/StataMP.app/Contents/MacOS/stata-mp
      STATA_PROFILE: ${{ inputs.profile || 'quick' }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Test CI receipt machinery
        run: /usr/bin/python3 -m unittest discover -s ci/tests -p 'test_*.py'

      - name: Run licensed Stata profile
        if: ${{ always() }}
        run: ./ci/run_stata_ci.sh "$STATA_PROFILE"

      - name: Run quick Rust/C/source checks on normal pushes
        if: ${{ always() && github.event_name == 'push' }}
        run: ./ci/record_rust_quick.sh

      - name: Add Rust result to the exact-SHA receipt
        if: ${{ always() && github.event_name == 'push' }}
        run: >-
          /usr/bin/python3 ci/augment_ci_receipt.py
          .ci/stata/run/receipt.json
          .ci/stata/run/rust-quick.status

      - name: Upload Mac CI logs, candidate, and receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stata-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/stata/run/
          if-no-files-found: error
          retention-days: 30

  publish-receipt:
    name: Publish exact-SHA receipt
    needs: mac-ci
    if: ${{ always() && needs.mac-ci.result != 'cancelled' }}
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out receipt publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Download Stata receipt
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: stata-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stata-receipt

      - name: Validate receipt identity
        env:
          STATA_PROFILE: ${{ inputs.profile || 'quick' }}
        run: >-
          /usr/bin/python3 ci/check_stata_receipt.py
          "$RUNNER_TEMP/stata-receipt/receipt.json"
          --expect-tested-sha "$GITHUB_SHA"
          --expect-profile "$STATA_PROFILE"

      - name: Commit per-SHA receipt and guarded latest pointer
        shell: bash
        env:
          RECEIPT: ${{ runner.temp }}/stata-receipt/receipt.json
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          result_path=".ci/stata/results/$GITHUB_SHA.json"
          publish_tree=""

          cleanup_publish_tree() {
            if [[ -n "$publish_tree" ]]; then
              cd "$GITHUB_WORKSPACE"
              git worktree remove --force "$publish_tree" 2>/dev/null || true
              git worktree prune
              publish_tree=""
            fi
          }
          trap cleanup_publish_tree EXIT

          for attempt in 1 2 3; do
            git fetch origin "$branch"
            publish_tree="$RUNNER_TEMP/stata-publish-$attempt"
            git worktree add --detach "$publish_tree" "origin/$branch"
            cd "$publish_tree"

            mkdir -p .ci/stata/results
            cp "$RECEIPT" "$result_path"

            if git merge-base --is-ancestor "$GITHUB_SHA" HEAD &&
               git diff --quiet "$GITHUB_SHA..HEAD" -- . \
                 ':(exclude).ci/stata/results/**' \
                 ':(exclude).ci/stata/latest.json'; then
              cp "$RECEIPT" .ci/stata/latest.json
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$result_path" .ci/stata/latest.json 2>/dev/null || git add "$result_path"

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m "ci(stata): record ${GITHUB_SHA:0:12} [skip ci]"
            if git push origin "HEAD:refs/heads/$branch"; then
              exit 0
            fi

            cleanup_publish_tree
          done

          echo "receipt publication lost three branch update races" >&2
          exit 1

  # BEGIN ONE-SHOT EXACT-ZERO FWL REPAIR
  apply-exact-zero-fwl-repair:
    name: Apply exact-zero FWL score repair
    needs: publish-receipt
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply idempotent repair and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          source = Path("crates/stfixest-core/src/ols/prepared_fit.rs")
          text = source.read_text(encoding="utf-8")
          old = '''    let mut relative_infinity_norm = finite_score.infinity_scale / response_scale;
    let response_square = response_scale * response_scale;
    let mut relative_square_sum = finite_score.square_sum_scale / response_square;
    let mut moments = finite_score.moments;
    if !relative_infinity_norm.is_finite() || !relative_square_sum.is_finite() {
        return Err(invalid_data(
            "prepared OLS finite-score response normalization is not finite",
        ));
    }
'''
          new = '''    let mut relative_infinity_norm = finite_score.infinity_scale / response_scale;
    // Normalize the finite-coordinate two norm before squaring. Squaring
    // `f64::MIN_POSITIVE` underflows to zero, so the algebraically equivalent
    // direct division of two squared norms would turn an exact zero score into
    // 0/0. A nonzero score against that scale still overflows and fails closed.
    let finite_relative_two_norm = finite_score.square_sum_scale.sqrt() / response_scale;
    let mut relative_square_sum = finite_relative_two_norm * finite_relative_two_norm;
    let mut moments = finite_score.moments;
    if !relative_infinity_norm.is_finite()
        || !finite_relative_two_norm.is_finite()
        || !relative_square_sum.is_finite()
    {
        return Err(invalid_data(
            "prepared OLS finite-score response normalization is not finite",
        ));
    }
'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("FWL response-normalization anchor is not unique")
              text = text.replace(old, new, 1)
          source.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/stata-ci.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          marker = "\n  # BEGIN ONE-SHOT EXACT-ZERO FWL REPAIR\n"
          if workflow_text.count(marker) != 1:
              raise SystemExit("exact-zero one-shot marker is not unique")
          workflow.write_text(workflow_text.split(marker, 1)[0] + "\n", encoding="utf-8")

          standalone = Path(".github/workflows/fix-fwl-zero-response.yml")
          if standalone.exists():
              standalone.unlink()
          PY

          toolchain_root="$(/opt/homebrew/bin/rustup run 1.85.1 rustc --print sysroot)"
          export PATH="$toolchain_root/bin:/opt/homebrew/bin:$PATH"
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test -p stfixest-core hidden_constant_reported_constant_and_fe_only_edges_are_explicit --no-default-features
          cargo test -p stfixest-core invalid_configs_pweights_and_nonpositive_residual_dof_fail_closed --no-default-features
          cargo test -p stfixest-core allocation_capacity_and_score_failures_are_fatal --no-default-features

      - name: Commit repair directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/stfixest-core/src/ols/prepared_fit.rs .github/workflows/stata-ci.yml
          git add -u .github/workflows/fix-fwl-zero-response.yml || true
          git commit -m "core: stabilize exact-zero FWL score normalization"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
