name: Probe runner coding-agent availability

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-codex-runner.yml"
  workflow_dispatch:

concurrency:
  group: stfixest-codex-probe-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Probe without invoking a model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/dev
          available=false
          version=""
          help_rc=127
          if command -v codex >/dev/null 2>&1; then
            available=true
            version="$(codex --version 2>&1 | head -1 | tr -cd '[:alnum:]. _-')"
            set +e
            codex exec --help >/tmp/stfixest-codex-help.txt 2>&1
            help_rc=$?
            set -e
          fi
          /usr/bin/python3 - "$available" "$version" "$help_rc" <<'PY'
          import json
          import sys
          from pathlib import Path
          available = sys.argv[1] == "true"
          document = {
              "schema_version": 1,
              "codex_executable_available": available,
              "codex_version": sys.argv[2] if available else None,
              "codex_exec_help_rc": int(sys.argv[3]),
              "model_invoked": False,
          }
          Path(".ci/dev/codex-runner-probe.json").write_text(
              json.dumps(document, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Publish sanitized probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/dev/codex-runner-probe.json
          git commit -m "ci(dev): record coding-agent runner probe [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
