name: Hosted release qualification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust-and-static:
    name: Linux source and Rust qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@85c23e28f7ccc75a9a153d45d385d94a85464876 # 1.85.1
        with:
          components: rustfmt, clippy
      - name: Repository, oracle, Rust, and C checks
        run: ./scripts/run_tests.sh

  linux-plugin:
    name: Linux glibc 2.28 plugin
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust and build plugin
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.85.1
          export PATH="$HOME/.cargo/bin:$PATH"
          ./scripts/build_linux.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fereg-linux-x86_64
          path: |
            dist/fereg_linux.plugin
            dist/fereg_linux.plugin.sha256

  windows-plugin:
    name: Windows x86-64 plugin
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@85c23e28f7ccc75a9a153d45d385d94a85464876 # 1.85.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Exercise Windows SPI ABI and exports
        shell: powershell
        run: ./tests/mock_spi/run_mock_bridge_test.ps1
      - name: Build Windows plugin
        shell: powershell
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fereg-windows-x86_64
          path: |
            dist/fereg_windows.plugin
            dist/fereg_windows.plugin.sha256

  macos-universal-plugin:
    name: Hosted universal macOS plugin
    runs-on: macos-14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@85c23e28f7ccc75a9a153d45d385d94a85464876 # 1.85.1
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build universal macOS plugin
        run: ./scripts/build_macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fereg-macos-universal
          path: |
            dist/fereg_macos.plugin
            dist/fereg_macos.plugin.sha256
