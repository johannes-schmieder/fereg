name: Harden stfeols completion driver authentication

on:
  push:
    branches: [main]
    paths: [".github/workflows/harden-stfeols-driver-auth.yml"]

permissions:
  contents: write

jobs:
  harden:
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Patch preflight idempotently
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/stfeols-autonomous-completion-v2.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          if ! test -s "$HOME/.codex/auth.json" &&
             test -z "${OPENAI_API_KEY:-}" &&
             test -z "${CODEX_API_KEY:-}"; then
            echo "No noninteractive Codex credential is available on the licensed runner." >&2
            exit 78
          fi
'''
          new = '''          probe_prompt="Reply with exactly READY. Do not inspect or modify repository files."
          probe_help="$RUNNER_TEMP/codex-exec-help.txt"
          probe=(codex exec)
          if grep -q -- '--sandbox' "$probe_help"; then
            probe+=(--sandbox read-only)
          fi
          if grep -q -- '--ask-for-approval' "$probe_help"; then
            probe+=(--ask-for-approval never)
          elif grep -q -- '--full-auto' "$probe_help"; then
            probe+=(--full-auto)
          fi
          if grep -q -- '--color' "$probe_help"; then
            probe+=(--color never)
          fi
          probe+=("$probe_prompt")
          "${probe[@]}" > "$RUNNER_TEMP/codex-auth-probe.txt"
          grep -q 'READY' "$RUNNER_TEMP/codex-auth-probe.txt"
'''
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('completion-driver authentication anchor is not unique')
          path.write_text(text, encoding='utf-8')

          for obsolete in (
              Path('.github/workflows/stfeols-autonomous-completion.yml'),
              Path('.github/workflows/harden-stfeols-driver-auth.yml'),
          ):
              if obsolete.exists():
                  obsolete.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci(stfeols): probe Codex authentication directly"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
