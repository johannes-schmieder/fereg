name: Provision exact Stata reference bundles

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-stata-require-bundle.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stfixest-provision-reference-bundles-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'johannes-schmieder/StFixest'
    runs-on: [self-hosted, macOS, ARM64, stata-mp, stfixest]
    timeout-minutes: 30
    steps:
      - name: Check out exact provisioning source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify previous exact-green source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path

          source_sha = "12f4453f05c47be98f3e5900fed24397a56976bb"
          receipt = Path(".ci/stata/results") / f"{source_sha}.json"
          payload = json.loads(receipt.read_text(encoding="utf-8"))
          expected = {
              "tested_sha": source_sha,
              "status": "success",
              "stata_status": "success",
              "rust_status": "success",
              "stata_rc": 0,
              "rust_rc": 0,
          }
          for key, value in expected.items():
              if payload.get(key) != value:
                  raise SystemExit(f"previous source receipt mismatch: {key}")
          PY

      - name: Select Python with tomllib
        id: python
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            /opt/homebrew/bin/python3
            /usr/local/bin/python3
            "$(command -v python3 2>/dev/null || true)"
            /usr/bin/python3
          )
          for candidate in "${candidates[@]}"; do
            [[ -n "$candidate" && -x "$candidate" ]] || continue
            if "$candidate" -c 'import sys, tomllib; assert sys.version_info >= (3, 11)' >/dev/null 2>&1; then
              echo "bin=$candidate" >> "$GITHUB_OUTPUT"
              "$candidate" --version
              exit 0
            fi
          done
          echo "No Python interpreter with tomllib is available on the trusted runner." >&2
          exit 1

      - name: Decode and verify bounded provisioner
        id: provisioner
        if: steps.python.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          PROVISION_PYTHON: ${{ steps.python.outputs.bin }}
          EXPECTED_PROVISIONER_SHA256: 632c777571f7003214030eaef98ee8d852b8d9fe09a30afb0f3e5461a34a4a23
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/ci/source-transforms/provision_reference_bundles.py.gz.b64"
          script="$GITHUB_WORKSPACE/ci/source-transforms/provision_reference_bundles.py"
          "$PROVISION_PYTHON" - "$archive" "$script" <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          import sys
          from pathlib import Path

          archive = Path(sys.argv[1])
          target = Path(sys.argv[2])
          payload = gzip.decompress(base64.b64decode(archive.read_text(encoding="ascii")))
          observed = hashlib.sha256(payload).hexdigest()
          if observed != os.environ["EXPECTED_PROVISIONER_SHA256"]:
              raise SystemExit("embedded provisioner digest mismatch")
          target.write_bytes(payload)
          target.chmod(0o700)
          PY
          "$PROVISION_PYTHON" -m py_compile "$script"
          echo "script=$script" >> "$GITHUB_OUTPUT"

      - name: Build and independently verify exact public bundles
        id: build
        if: steps.python.outcome == 'success' && steps.provisioner.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          PROVISION_PYTHON: ${{ steps.python.outputs.bin }}
          PROVISION_SCRIPT: ${{ steps.provisioner.outputs.script }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stfixest-reference-bundles"
          rm -rf "$stage"
          "$PROVISION_PYTHON" "$PROVISION_SCRIPT" build --output-dir "$stage"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Publish bundles, offline resolver, tests, and status
        id: publish
        if: steps.python.outcome == 'success' && steps.provisioner.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          PROVISION_PYTHON: ${{ steps.python.outputs.bin }}
          PROVISION_SCRIPT: ${{ steps.provisioner.outputs.script }}
          BUNDLE_STAGE: ${{ steps.build.outputs.stage }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          publish_tree=""
          cleanup() {
            if [[ -n "$publish_tree" ]]; then
              git worktree remove --force "$publish_tree" 2>/dev/null || true
              git worktree prune
              publish_tree=""
            fi
          }
          trap cleanup EXIT

          for attempt in 1 2 3; do
            git fetch origin "$BRANCH_NAME"
            publish_tree="$RUNNER_TEMP/reference-bundle-publish-$attempt"
            git worktree add --detach "$publish_tree" "origin/$BRANCH_NAME"
            "$PROVISION_PYTHON" "$PROVISION_SCRIPT" apply \
              --repository "$publish_tree" \
              --bundle-stage "$BUNDLE_STAGE" \
              --source-sha "$GITHUB_SHA"
            git -C "$publish_tree" config user.name "github-actions[bot]"
            git -C "$publish_tree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$publish_tree" add -A
            git -C "$publish_tree" diff --cached --check
            if git -C "$publish_tree" diff --cached --quiet; then
              exit 0
            fi
            git -C "$publish_tree" commit -m "ci(reference): provision exact offline reference bundles"
            if git -C "$publish_tree" push origin "HEAD:refs/heads/$BRANCH_NAME"; then
              exit 0
            fi
            cleanup
          done
          echo "reference-bundle publication lost three branch races" >&2
          exit 1

      - name: Publish redacted provisioning failure receipt
        if: always() && (steps.python.outcome != 'success' || steps.provisioner.outcome != 'success' || steps.build.outcome != 'success' || steps.publish.outcome != 'success')
        shell: bash
        env:
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          PROVISIONER_OUTCOME: ${{ steps.provisioner.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/reference-bundle-provision-failure.json"
          RECEIPT="$receipt" /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          if os.environ.get("PYTHON_OUTCOME") != "success":
              failure_kind = "python_tomllib_unavailable"
          elif os.environ.get("PROVISIONER_OUTCOME") != "success":
              failure_kind = "reference_provisioner_decode_failure"
          elif os.environ.get("BUILD_OUTCOME") != "success":
              failure_kind = "reference_bundle_build_failure"
          else:
              failure_kind = "reference_bundle_publish_failure"
          payload = {
              "schema": 1,
              "status": "failure",
              "failure_kind": failure_kind,
              "source_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "branch": os.environ["GITHUB_REF_NAME"],
              "python_outcome": os.environ.get("PYTHON_OUTCOME", "unknown"),
              "provisioner_outcome": os.environ.get("PROVISIONER_OUTCOME", "unknown"),
              "build_outcome": os.environ.get("BUILD_OUTCOME", "unknown"),
              "publish_outcome": os.environ.get("PUBLISH_OUTCOME", "unknown"),
              "raw_paths_committed": False,
          }
          Path(os.environ["RECEIPT"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          result_path=".ci/source-transform/results/$GITHUB_SHA-reference-bundle-provision.json"
          publish_tree=""
          cleanup() {
            if [[ -n "$publish_tree" ]]; then
              git worktree remove --force "$publish_tree" 2>/dev/null || true
              git worktree prune
              publish_tree=""
            fi
          }
          trap cleanup EXIT
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH_NAME"
            publish_tree="$RUNNER_TEMP/reference-bundle-failure-publish-$attempt"
            git worktree add --detach "$publish_tree" "origin/$BRANCH_NAME"
            mkdir -p "$publish_tree/$(dirname "$result_path")"
            cp "$receipt" "$publish_tree/$result_path"
            git -C "$publish_tree" config user.name "github-actions[bot]"
            git -C "$publish_tree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$publish_tree" add "$result_path"
            if git -C "$publish_tree" diff --cached --quiet; then
              exit 0
            fi
            git -C "$publish_tree" commit -m "ci(source-transform): record ${GITHUB_SHA:0:12} reference-bundle failure [skip ci]"
            if git -C "$publish_tree" push origin "HEAD:refs/heads/$BRANCH_NAME"; then
              exit 0
            fi
            cleanup
          done
          exit 1

      - name: Enforce provisioning success
        if: always()
        shell: bash
        env:
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          PROVISIONER_OUTCOME: ${{ steps.provisioner.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          test "$PYTHON_OUTCOME" = success
          test "$PROVISIONER_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
          test "$PUBLISH_OUTCOME" = success
