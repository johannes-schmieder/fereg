[package]
name = "fedemean"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["fereg contributors"]
license = "MIT"
description = "Weighted fixed-effect projection (residualization) for high-dimensional categorical designs"
publish = false

[lib]
path = "src/lib.rs"

[features]
# CMG local solves on retained diagonal blocks (same pinned revision and
# features as fereg-core, so the lock file gains no package).
cmg = ["dep:cmg"]
# Modified LSMR and additive Schwarz on the full formulation (schwarz-precond
# at fereg-core's pinned revision; approx-chol at the version already in the
# lock file through within, so the lock file gains no package).
schwarz = ["dep:schwarz-precond", "dep:approx-chol"]

[dependencies]
rayon = "1.12"
cmg = { git = "https://github.com/johannes-schmieder/CMG", rev = "368eceba765db91ff818815698da35889ce42ed0", features = ["parallel", "experimental-components"], optional = true }
schwarz-precond = { git = "https://github.com/johannes-schmieder/within", rev = "8d401d8278ac783b2f258c459e057f30cd80d595", package = "schwarz-precond", optional = true }
approx-chol = { version = "=0.6.0", optional = true }

[lints]
workspace = true
