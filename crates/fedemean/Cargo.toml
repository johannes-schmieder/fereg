[package]
name = "fedemean"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["fereg contributors"]
license = "MIT"
description = "Weighted fixed-effect projection (residualization) for high-dimensional categorical designs"
publish = false

[lib]
path = "src/lib.rs"

[features]
# CMG local solves on retained diagonal blocks (same pinned revision and
# features as fereg-core, so the lock file gains no package).
cmg = ["dep:cmg"]

[dependencies]
rayon = "1.12"
cmg = { git = "https://github.com/johannes-schmieder/CMG", rev = "e5613e81fb3b03c78de98658b372646fa802aabb", features = ["parallel", "experimental-components"], optional = true }

[lints]
workspace = true
