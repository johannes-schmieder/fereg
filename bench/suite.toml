schema = 1
seed = 739391
# Both public estimators accept the explicit native engine selector.
engine_option = true

[protocol]
warmups = 1
repetitions = 5
coefficient_rtol = 1e-7
coefficient_atol = 1e-10
reference_tolerance = 1e-12
fresh_process_per_command = true

[comparators]
ols = ["fereg", "reghdfe", "fixest", "fixest-matched"]
ppml = ["fereg", "ppmlhdfe", "fixest", "fixest-matched"]

[tiers.smoke]
cells = ["ols-1fe", "ols-2fe-dense", "ppml-1fe", "ppml-2fe-gravity"]
rows = 100000
threads = [4]
timeout_seconds = 300
wall_budget_seconds = 300

[tiers.standard]
non_scc = true
threads = [1, 8]
timeout_seconds = 1800
wall_budget_seconds = 3600

[tiers.full]
all_cells = true
threads = [1, 8]
timeout_seconds = 7200
ladder_cells = ["ols-2fe-akm-strong", "ols-3fe", "ppml-3fe-gravity"]
ladder_threads = [1, 2, 4, 8, 14, 28]

[defaults]
rows = 1000000
regressors = 10
weights = "unit"
vce = "iid"
outputs = false
scc = false

